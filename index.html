            seededRand(seed) {
                let x = Math.sin(seed * 9999.91) * 10000;
                return x - Math.floor(x);
            }

            shuffleWithSeed(arr, seed) {
                let copy = [...arr];
                for (let i = copy.length - 1; i &gt; 0; i--) {
                    const j = Math.floor(this.seededRand(seed + i) * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            updateUI() {
                let totalCompleted = 0;
                const totalPossible = this.categories.length * 250;

                this.categories.forEach(cat =&gt; {
                    const prog = this.progress[cat] || { completed: 0 };
                    totalCompleted += prog.completed;
                    const pct = Math.min(100, Math.round((prog.completed / 250) * 100));

                    const txt = document.getElementById(`prog-text-${cat}`);
                    const bar = document.getElementById(`prog-bar-${cat}`);
                    const pctTxt = document.getElementById(`prog-pct-${cat}`);

                    if (txt) txt.innerText = `${prog.completed} / 250`;
                    if (pctTxt) pctTxt.innerText = `${pct}%`;
                    if (bar) bar.style.width = `${pct}%`;
                });

                document.getElementById(&#x27;global-stars&#x27;).innerText = this.globalStars;
                document.getElementById(&#x27;global-streak&#x27;).innerText = this.globalStreak;

                const overallReadiness = Math.round((totalCompleted / totalPossible) * 100);
                document.getElementById(&#x27;readiness-score-display&#x27;).innerText = `${overallReadiness}%`;
            }

                    this.quizQuestions = fullPool;
                    // Resume from where student left off if under 250
                    const savedCompleted = this.progress[track]?.completed || 0;
                    if (savedCompleted &gt; 0 &amp;&amp; savedCompleted &lt; 250) {
                        this.currentQIndex = savedCompleted;
                    }
                }

                document.querySelectorAll(&#x27;main &gt; section&#x27;).forEach(s =&gt; s.classList.add(&#x27;hidden&#x27;));
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.remove(&#x27;hidden&#x27;);

                document.getElementById(&#x27;arena-track-title&#x27;).innerText = this.categoryNames[track];
                document.getElementById(&#x27;arena-mode-badge&#x27;).innerText = this.isJistMode ? &quot;25-Q DIAGNOSTIC&quot; : &quot;250 TEST TRACK&quot;;
                this.loadArenaQuestion();
            }

            toggleRushMode() {
                this.isRushMode = !this.isRushMode;
                const btn = document.getElementById(&#x27;toggle-rush-mode&#x27;);
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);

                if (this.isRushMode) {
                    btn.className = &quot;px-3 py-1.5 bg-rose-600 text-xs font-bold text-white border border-rose-400 rounded-xl shadow-md&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: ON&quot;;
                    timerDisp.classList.remove(&#x27;hidden&#x27;);
                    if (!this.questionAnswered) this.startRushTimer();
                } else {
                    btn.className = &quot;px-3 py-1.5 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: OFF&quot;;
                    timerDisp.classList.add(&#x27;hidden&#x27;);
                    clearInterval(this.rushTimer);
                }
            }

            startRushTimer() {
                clearInterval(this.rushTimer);
                this.timeLeft = 20;
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);
                timerDisp.innerText = `${this.timeLeft}s`;

                this.rushTimer = setInterval(() =&gt; {
                    this.timeLeft--;
                    timerDisp.innerText = `${this.timeLeft}s`;
                    if (this.timeLeft &lt;= 0) {
                        clearInterval(this.rushTimer);
                        this.selectOption(-1, true);
                    }
                }, 1000);
            }

            loadArenaQuestion() {
                this.questionAnswered = false;
                const q = this.quizQuestions[this.currentQIndex];

                document.getElementById(&#x27;arena-track-subtitle&#x27;).innerText = `Question ${this.currentQIndex + 1} of ${this.quizQuestions.length}`;
                document.getElementById(&#x27;arena-category-badge&#x27;).innerText = q.badge;
                document.getElementById(&#x27;arena-passage-box&#x27;).innerText = q.passage;
                document.getElementById(&#x27;arena-question-text&#x27;).innerText = q.question;

                const grid = document.getElementById(&#x27;arena-options-grid&#x27;);
                grid.innerHTML = &#x27;&#x27;;
                const letters = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];

                q.options.forEach((optText, idx) =&gt; {
                    const btn = document.createElement(&#x27;button&#x27;);
                    btn.id = `opt-btn-${idx}`;
                    btn.onclick = () =&gt; this.selectOption(idx, false);
                    btn.className = &quot;text-left p-4 rounded-2xl bg-slate-900 hover:bg-slate-800 border-2 border-slate-800 hover:border-cyan-500/60 transition-all flex items-start space-x-3 group&quot;;
                    btn.innerHTML = `
                        &lt;span class=&quot;w-7 h-7 rounded-lg bg-slate-800 group-hover:bg-cyan-500 group-hover:text-slate-950 text-cyan-400 font-extrabold text-xs flex items-center justify-center shrink-0 mt-0.5 transition&quot;&gt;${letters[idx]}&lt;/span&gt;
                        &lt;span class=&quot;text-xs md:text-sm text-slate-200 font-medium leading-snug&quot;&gt;${optText}&lt;/span&gt;
                    `;
                    grid.appendChild(btn);
                });

                document.getElementById(&#x27;arena-feedback-box&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);

                if (this.isRushMode) this.startRushTimer();
            }

            selectOption(chosenIdx, isTimeout = false) {
                if (this.questionAnswered) return;
                this.questionAnswered = true;
                clearInterval(this.rushTimer);

                const q = this.quizQuestions[this.currentQIndex];
                const isCorrect = (!isTimeout &amp;&amp; chosenIdx === q.correctIndex);

                // Highlight option buttons
                q.options.forEach((_, idx) =&gt; {
                    const btn = document.getElementById(`opt-btn-${idx}`);
                    btn.disabled = true;
                    if (idx === q.correctIndex) {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-emerald-500/20 border-2 border-emerald-500 flex items-start space-x-3&quot;;
                    } else if (idx === chosenIdx &amp;&amp; !isCorrect) {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-rose-500/20 border-2 border-rose-500 flex items-start space-x-3&quot;;
                    } else {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-slate-900/40 border-2 border-slate-800/50 opacity-50 flex items-start space-x-3&quot;;
                    }
                });

                const feedbackBox = document.getElementById(&#x27;arena-feedback-box&#x27;);
                const feedbackTitle = document.getElementById(&#x27;arena-feedback-title&#x27;);
                const feedbackBody = document.getElementById(&#x27;arena-feedback-body&#x27;);

                feedbackBox.classList.remove(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.remove(&#x27;hidden&#x27;);

                if (isCorrect) {
                    this.globalStars += 5;
                    this.globalStreak++;
                    if (!this.isJistMode) {
                        this.progress[this.currentTrack].completed = Math.min(250, Math.max(this.progress[this.currentTrack].completed, this.currentQIndex + 1));
                    }
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-emerald-500/10 border-emerald-500/40 text-emerald-300&quot;;
                    feedbackTitle.innerText = &quot;🎉 Spot On! +5 XP&quot;;
                    feedbackBody.innerText = q.explanation;
                } else {
                    this.globalStreak = 0;
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-rose-500/10 border-rose-500/40 text-rose-300&quot;;
                    feedbackTitle.innerText = isTimeout ? &quot;⏰ Time Expired!&quot; : &quot;❌ Not Quite — Check the Text Evidence&quot;;
                    feedbackBody.innerText = q.explanation;
                }

                this.saveData();
            }

            nextPracticeQuestion() {
                if (this.currentQIndex &lt; this.quizQuestions.length - 1) {
                    this.currentQIndex++;
                    this.loadArenaQuestion();
                } else {
                    // Show completion banner inside feedback box
                    const feedbackBox = document.getElementById(&#x27;arena-feedback-box&#x27;);
                    const feedbackTitle = document.getElementById(&#x27;arena-feedback-title&#x27;);
                    const feedbackBody = document.getElementById(&#x27;arena-feedback-body&#x27;);
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-cyan-500/20 border-cyan-500 text-cyan-200&quot;;
                    feedbackTitle.innerText = &quot;🏆 Track Complete!&quot;;
                    feedbackBody.innerText = `Awesome work! You completed all ${this.quizQuestions.length} questions in ${this.categoryNames[this.currentTrack]}. Click &#x27;Exit Track&#x27; to choose your next challenge!`;
                    document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);
                }
            }

            closePracticeArena() {
                clearInterval(this.rushTimer);
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;tab-dashboard&#x27;).classList.remove(&#x27;hidden&#x27;);
                this.updateUI();
            }

            // Ultimate Study Hub
            selectUltimateTopic(topic) {
                this.selectedUltTopic = topic;
                this.examplesPage = 0;
                document.getElementById(&#x27;example-search-input&#x27;).value = &#x27;&#x27;;

                document.querySelectorAll(&#x27;.ult-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-300 hover:text-white&quot;;
                });
                const activeBtn = document.getElementById(`ult-tab-${topic}`);
                if (activeBtn) activeBtn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-300&quot;;

                document.getElementById(&#x27;jist-banner-title&#x27;).innerText = `${this.categoryNames[topic]}: Get the Jist Quiz`;
                document.getElementById(&#x27;examples-hub-title&#x27;).innerText = `250 Worked Examples: ${this.categoryNames[topic]}`;
                this.renderWorkedExamples();
            }

            changeExamplePage(delta) {
                const maxPages = Math.ceil(250 / this.examplesPerPage);
                this.examplesPage = Math.max(0, Math.min(maxPages - 1, this.examplesPage + delta));
                this.renderWorkedExamples(document.getElementById(&#x27;example-search-input&#x27;).value);
            }

            filterExamples() {
                this.examplesPage = 0;
                this.renderWorkedExamples(document.getElementById(&#x27;example-search-input&#x27;).value);
            }

            renderWorkedExamples(filter = &#x27;&#x27;) {
                const container = document.getElementById(&#x27;examples-list-container&#x27;);
                container.innerHTML = &#x27;&#x27;;

                let items = this.examplesData[this.selectedUltTopic] || [];
                if (filter.trim()) {
                    const q = filter.toLowerCase();
                    items = items.filter(x =&gt;
                        x.title.toLowerCase().includes(q) ||
                        x.passage.toLowerCase().includes(q) ||
                        x.analysis.toLowerCase().includes(q)
                    );
                }

                const start = this.examplesPage * this.examplesPerPage;
                const end = Math.min(items.length, start + this.examplesPerPage);
                document.getElementById(&#x27;examples-page-info&#x27;).innerText = items.length === 0
                    ? &#x27;No matching examples&#x27;
                    : `Showing ${start + 1}–${end} of ${items.length}`;

                items.slice(start, end).forEach(item =&gt; {
                    const div = document.createElement(&#x27;div&#x27;);
                    div.className = &quot;bg-slate-950/90 border border-slate-800 p-4 rounded-2xl space-y-2.5&quot;;
                    div.innerHTML = `
                        &lt;div class=&quot;flex items-center justify-between&quot;&gt;
                            &lt;span class=&quot;text-xs font-extrabold text-emerald-400 font-heading&quot;&gt;${item.title}&lt;/span&gt;
                            &lt;span class=&quot;text-[10px] bg-slate-900 border border-slate-700 text-cyan-300 px-2.5 py-0.5 rounded-full font-semibold&quot;&gt;${item.tag}&lt;/span&gt;

                        &lt;p class=&quot;text-xs md:text-sm text-slate-200 leading-relaxed&quot;&gt;&quot;${item.passage}&quot;&lt;/p&gt;
                        &lt;details class=&quot;group&quot;&gt;
                            &lt;summary class=&quot;text-xs font-bold text-amber-400 cursor-pointer hover:text-amber-300 select-none&quot;&gt;

                            &lt;/summary&gt;
                            &lt;div class=&quot;mt-2 text-xs text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800 leading-relaxed&quot;&gt;
                                ${item.analysis}
                            &lt;/div&gt;
                        &lt;/details&gt;
                    `;
                    container.appendChild(div);

            }

            startJistQuiz() {
                this.launchPractice(this.selectedUltTopic, 25);
            }

            selectVaultCategory(cat) {
                this.selectedVaultTopic = cat;
                this.currentCardIdx = 0;
                this.isFlipped = false;

                document.querySelectorAll(&#x27;.vault-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-300&quot;;
                });
                const active = document.getElementById(`vault-tab-${cat}`);
                if (active) active.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-300&quot;;

                this.renderFlashcard();
            }

            getFilteredDeck() {
                const deck = this.flashcardsData[this.selectedVaultTopic] || [];
                if (!this.showOnlyReview) return deck;
                return deck.filter(c =&gt; !this.masteredCards[`${this.selectedVaultTopic}_${c.id}`]);
            }

            renderFlashcard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) {
                    document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `0 / 0`;
                    document.getElementById(&#x27;card-front&#x27;).innerText = `🎉 All 250 Cards Mastered!`;
                    document.getElementById(&#x27;card-back&#x27;).innerText = `Literacy Champion!`;
                    document.getElementById(&#x27;card-tip&#x27;).innerText = `Click &quot;Show All&quot; to review the full deck again.`;
                    document.getElementById(&#x27;flashcard-mastered-badge&#x27;).classList.add(&#x27;hidden&#x27;);
                    return;
                }

                if (this.currentCardIdx &gt;= deck.length) this.currentCardIdx = 0;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;
                const isMastered = !!this.masteredCards[cardKey];

                document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `${this.currentCardIdx + 1} / ${deck.length}`;
                document.getElementById(&#x27;card-front&#x27;).innerText = card.front;
                document.getElementById(&#x27;card-back&#x27;).innerText = card.back;
                document.getElementById(&#x27;card-tip&#x27;).innerText = card.tip;

                const badge = document.getElementById(&#x27;flashcard-mastered-badge&#x27;);
                if (isMastered) badge.classList.remove(&#x27;hidden&#x27;);
                else badge.classList.add(&#x27;hidden&#x27;);

                document.getElementById(&#x27;btn-toggle-mastery&#x27;).innerText = isMastered ? &quot;Unmark Mastered&quot; : &quot;Mark Mastered&quot;;

                const flipper = document.getElementById(&#x27;flashcard-flipper&#x27;);
                flipper.style.transform = &#x27;rotateY(0deg)&#x27;;
                this.isFlipped = false;
            }

            jumpToCard(num) {
                const deck = this.getFilteredDeck();
                const idx = parseInt(num, 10) - 1;
                if (!isNaN(idx) &amp;&amp; idx &gt;= 0 &amp;&amp; idx &lt; deck.length) {
                    this.currentCardIdx = idx;
                    this.renderFlashcard();
                }
            }

            toggleMastery() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;

                if (this.masteredCards[cardKey]) {
                    delete this.masteredCards[cardKey];
                } else {
                    this.masteredCards[cardKey] = true;
                }
                this.saveData();
                this.renderFlashcard();
            }

            toggleFilterMastered() {
                this.showOnlyReview = !this.showOnlyReview;
                this.currentCardIdx = 0;
                const btn = document.getElementById(&#x27;btn-filter-mastered&#x27;);
                btn.innerText = this.showOnlyReview ? &quot;Needs Review&quot; : &quot;Show All&quot;;
                btn.className = this.showOnlyReview
                    ? &quot;px-3 py-2 bg-amber-500/20 text-xs font-bold text-amber-300 border border-amber-500/40 rounded-xl transition&quot;
                    : &quot;px-3 py-2 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                this.renderFlashcard();
            }

            flipCard() {
                const flipper = document.getElementById(&#x27;flashcard-flipper&#x27;);
                this.isFlipped = !this.isFlipped;
                flipper.style.transform = this.isFlipped ? &#x27;rotateY(180deg)&#x27; : &#x27;rotateY(0deg)&#x27;;
            }

            nextCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx + 1) % deck.length;
                this.renderFlashcard();
            }

            prevCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx - 1 + deck.length) % deck.length;
                this.renderFlashcard();
            }

            randomCard() {
                const deck = this.getFilteredDeck();
                if (deck.length &lt;= 1) return;
                this.currentCardIdx = Math.floor(Math.random() * deck.length);
                this.renderFlashcard();
            }
        }

        let app;
        window.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
            app = new ReadingStudyHallExtreme();
            window.app = app;
        });
    &lt;/script&gt;

            seededRand(seed) {
                let x = Math.sin(seed * 9999.91) * 10000;
                return x - Math.floor(x);
            }

            shuffleWithSeed(arr, seed) {
                let copy = [...arr];
                for (let i = copy.length - 1; i &gt; 0; i--) {
                    const j = Math.floor(this.seededRand(seed + i) * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

                clearInterval(this.rushTimer);

                document.getElementById(`tab-${tab}`).classList.remove(&#x27;hidden&#x27;);

                [&#x27;dashboard&#x27;, &#x27;ultimate&#x27;, &#x27;vault&#x27;].forEach(t =&gt; {
                    const btn = document.getElementById(`nav-${t}-btn`);
                    if (t === tab) {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-amber-500 text-slate-950 shadow-md&quot;;
                    } else {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-800&quot;;
                    }
                });
            }

            updateUI() {
                let totalCompleted = 0;
                const totalPossible = this.categories.length * 250;

                this.categories.forEach(cat =&gt; {
                    const prog = this.progress[cat] || { completed: 0 };
                    totalCompleted += prog.completed;
                    const pct = Math.min(100, Math.round((prog.completed / 250) * 100));

                    const txt = document.getElementById(`prog-text-${cat}`);
                    const bar = document.getElementById(`prog-bar-${cat}`);
                    const pctTxt = document.getElementById(`prog-pct-${cat}`);

                    if (txt) txt.innerText = `${prog.completed} / 250`;
                    if (pctTxt) pctTxt.innerText = `${pct}%`;
                    if (bar) bar.style.width = `${pct}%`;
                });

                document.getElementById(&#x27;global-stars&#x27;).innerText = this.globalStars;
                document.getElementById(&#x27;global-streak&#x27;).innerText = this.globalStreak;

                const overallReadiness = Math.round((totalCompleted / totalPossible) * 100);
                document.getElementById(&#x27;readiness-score-display&#x27;).innerText = `${overallReadiness}%`;
                document.getElementById(&#x27;header-readiness&#x27;).innerText = `${overallReadiness}%`;
            }

            // Launch 250-Q Track or 25-Q Diagnostic
            launchPractice(track, count = 250) {
                this.currentTrack = track;
                this.isJistMode = (count === 25);
                this.currentQIndex = 0;
                this.questionAnswered = false;

                const fullPool = this.allQuestions[track];
                if (this.isJistMode) {
                    this.quizQuestions = fullPool.filter((_, idx) =&gt; idx % 10 === 0).slice(0, 25);
                } else {
                    this.quizQuestions = fullPool;
                    const savedCompleted = this.progress[track]?.completed || 0;
                    if (savedCompleted &gt; 0 &amp;&amp; savedCompleted &lt; 250) {
                        this.currentQIndex = savedCompleted;
                    }
                }

                document.querySelectorAll(&#x27;main &gt; section&#x27;).forEach(s =&gt; s.classList.add(&#x27;hidden&#x27;));
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.remove(&#x27;hidden&#x27;);

                document.getElementById(&#x27;arena-track-title&#x27;).innerText = this.categoryNames[track];
                document.getElementById(&#x27;arena-mode-badge&#x27;).innerText = this.isJistMode ? &quot;25-Q DIAGNOSTIC&quot; : &quot;250 TEST TRACK&quot;;
                this.loadArenaQuestion();
            }

            toggleRushMode() {
                this.isRushMode = !this.isRushMode;
                const btn = document.getElementById(&#x27;toggle-rush-mode&#x27;);
                const headerBtn = document.getElementById(&#x27;header-rush-btn&#x27;);
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);

                if (this.isRushMode) {
                    btn.className = &quot;px-3 py-1.5 bg-rose-600 text-xs font-bold text-white border border-rose-400 rounded-xl shadow-md&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: ON&quot;;
                    headerBtn.className = &quot;px-2.5 py-1.5 bg-rose-600 text-xs font-bold text-white border border-rose-400 rounded-xl shadow-md&quot;;
                    headerBtn.innerText = &quot;⏱️ Rush: ON&quot;;
                    timerDisp.classList.remove(&#x27;hidden&#x27;);
                    if (!document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.contains(&#x27;hidden&#x27;) &amp;&amp; !this.questionAnswered) {
                        this.startRushTimer();
                    }
                } else {
                    btn.className = &quot;px-3 py-1.5 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: OFF&quot;;
                    headerBtn.className = &quot;px-2.5 py-1.5 bg-slate-900 text-xs font-bold text-slate-400 border border-slate-800 rounded-xl hover:text-white transition&quot;;
                    headerBtn.innerText = &quot;⏱️ Rush: OFF&quot;;
                    timerDisp.classList.add(&#x27;hidden&#x27;);
                    clearInterval(this.rushTimer);
                }
            }

                clearInterval(this.rushTimer);
                this.timeLeft = 20;
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);
                timerDisp.innerText = `${this.timeLeft}s`;

                this.rushTimer = setInterval(() =&gt; {
                    this.timeLeft--;
                    timerDisp.innerText = `${this.timeLeft}s`;
                    if (this.timeLeft &lt;= 0) {
                        clearInterval(this.rushTimer);
                        this.selectOption(-1, true);
                    }
                }, 1000);
            }

            loadArenaQuestion() {
                this.questionAnswered = false;
                const q = this.quizQuestions[this.currentQIndex];

                document.getElementById(&#x27;arena-track-subtitle&#x27;).innerText = `Question ${this.currentQIndex + 1} of ${this.quizQuestions.length}`;
                document.getElementById(&#x27;arena-category-badge&#x27;).innerText = q.badge;
                document.getElementById(&#x27;arena-scenario-box&#x27;).innerText = q.scenario;
                document.getElementById(&#x27;arena-question-text&#x27;).innerText = q.question;

                const grid = document.getElementById(&#x27;arena-options-grid&#x27;);
                grid.innerHTML = &#x27;&#x27;;
                const letters = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];

                q.options.forEach((optText, idx) =&gt; {
                    const btn = document.createElement(&#x27;button&#x27;);
                    btn.id = `opt-btn-${idx}`;
                    btn.onclick = () =&gt; this.selectOption(idx, false);
                    btn.className = &quot;text-left p-4 rounded-2xl bg-slate-900 hover:bg-slate-800 border-2 border-slate-800 hover:border-amber-500/60 transition-all flex items-start space-x-3 group&quot;;
                    btn.innerHTML = `
                        &lt;span class=&quot;w-7 h-7 rounded-lg bg-slate-800 group-hover:bg-amber-500 group-hover:text-slate-950 text-amber-400 font-extrabold text-xs flex items-center justify-center shrink-0 mt-0.5 transition&quot;&gt;${letters[idx]}&lt;/span&gt;
                        &lt;span class=&quot;text-xs md:text-sm text-slate-200 font-medium leading-snug&quot;&gt;${optText}&lt;/span&gt;
                    `;
                    grid.appendChild(btn);
                });

                document.getElementById(&#x27;arena-feedback-box&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);

                if (this.isRushMode) this.startRushTimer();
            }

            selectOption(chosenIdx, isTimeout = false) {
                if (this.questionAnswered) return;
                this.questionAnswered = true;
                clearInterval(this.rushTimer);

                const q = this.quizQuestions[this.currentQIndex];
                const isCorrect = (!isTimeout &amp;&amp; chosenIdx === q.correctIndex);

                q.options.forEach((_, idx) =&gt; {
                    const btn = document.getElementById(`opt-btn-${idx}`);
                    btn.disabled = true;
                    if (idx === q.correctIndex) {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-emerald-500/20 border-2 border-emerald-500 flex items-start space-x-3&quot;;
                    } else if (idx === chosenIdx &amp;&amp; !isCorrect) {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-rose-500/20 border-2 border-rose-500 flex items-start space-x-3&quot;;
                    } else {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-slate-900/40 border-2 border-slate-800/50 opacity-50 flex items-start space-x-3&quot;;
                    }
                });

                const feedbackBox = document.getElementById(&#x27;arena-feedback-box&#x27;);
                const feedbackTitle = document.getElementById(&#x27;arena-feedback-title&#x27;);
                const feedbackBody = document.getElementById(&#x27;arena-feedback-body&#x27;);

                feedbackBox.classList.remove(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.remove(&#x27;hidden&#x27;);

                if (isCorrect) {
                    this.globalStars += 5;
                    this.globalStreak++;
                    if (!this.isJistMode) {
                        this.progress[this.currentTrack].completed = Math.min(250, Math.max(this.progress[this.currentTrack].completed, this.currentQIndex + 1));
                    }
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-emerald-500/10 border-emerald-500/40 text-emerald-300&quot;;
                    feedbackTitle.innerText = &quot;🎉 Correct! +5 XP&quot;;
                    feedbackBody.innerText = q.explanation;
                } else {
                    this.globalStreak = 0;
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-rose-500/10 border-rose-500/40 text-rose-300&quot;;
                    feedbackTitle.innerText = isTimeout ? &quot;⏰ Time Expired!&quot; : &quot;❌ Review the Historical / Geographic Context&quot;;
                    feedbackBody.innerText = q.explanation;
                }

                this.saveData();
            }

            nextPracticeQuestion() {
                if (this.currentQIndex &lt; this.quizQuestions.length - 1) {
                    this.currentQIndex++;
                    this.loadArenaQuestion();
                } else {
                    const feedbackBox = document.getElementById(&#x27;arena-feedback-box&#x27;);
                    const feedbackTitle = document.getElementById(&#x27;arena-feedback-title&#x27;);
                    const feedbackBody = document.getElementById(&#x27;arena-feedback-body&#x27;);
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-amber-500/20 border-amber-500 text-amber-200&quot;;
                    feedbackTitle.innerText = &quot;🏆 Track Complete!&quot;;
                    feedbackBody.innerText = `Outstanding achievement! You finished all ${this.quizQuestions.length} questions in ${this.categoryNames[this.currentTrack]}. Click &#x27;Exit Track&#x27; to continue your prep!`;
                    document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);
                }
            }

            closePracticeArena() {
                clearInterval(this.rushTimer);
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;tab-dashboard&#x27;).classList.remove(&#x27;hidden&#x27;);
                this.updateUI();
            }

            // Ultimate Study Hub
            selectUltimateTopic(topic) {
                this.selectedUltTopic = topic;
                this.examplesPage = 0;
                document.getElementById(&#x27;example-search-input&#x27;).value = &#x27;&#x27;;

                document.querySelectorAll(&#x27;.ult-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-300 hover:text-white&quot;;
                });
                const activeBtn = document.getElementById(`ult-tab-${topic}`);
                if (activeBtn) activeBtn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-300&quot;;

                document.getElementById(&#x27;jist-banner-title&#x27;).innerText = `${this.categoryNames[topic]}: Get the Jist Quiz`;
                document.getElementById(&#x27;examples-hub-title&#x27;).innerText = `250 Worked Examples: ${this.categoryNames[topic]}`;
                this.renderWorkedExamples();
            }

            changeExamplePage(delta) {
                const maxPages = Math.ceil(250 / this.examplesPerPage);
                this.examplesPage = Math.max(0, Math.min(maxPages - 1, this.examplesPage + delta));
                this.renderWorkedExamples(document.getElementById(&#x27;example-search-input&#x27;).value);
            }

            filterExamples() {
                this.examplesPage = 0;
                this.renderWorkedExamples(document.getElementById(&#x27;example-search-input&#x27;).value);
            }

            renderWorkedExamples(filter = &#x27;&#x27;) {
                const container = document.getElementById(&#x27;examples-list-container&#x27;);
                container.innerHTML = &#x27;&#x27;;

                let items = this.examplesData[this.selectedUltTopic] || [];
                if (filter.trim()) {
                    const q = filter.toLowerCase();
                    items = items.filter(x =&gt;
                        x.title.toLowerCase().includes(q) ||
                        x.scenario.toLowerCase().includes(q) ||
                        x.analysis.toLowerCase().includes(q)
                    );
                }

                const start = this.examplesPage * this.examplesPerPage;
                const end = Math.min(items.length, start + this.examplesPerPage);
                document.getElementById(&#x27;examples-page-info&#x27;).innerText = items.length === 0
                    ? &#x27;No matching examples&#x27;
                    : `Showing ${start + 1}–${end} of ${items.length}`;

                items.slice(start, end).forEach(item =&gt; {
                    const div = document.createElement(&#x27;div&#x27;);
                    div.className = &quot;bg-slate-950/90 border border-slate-800 p-4 rounded-2xl space-y-2.5&quot;;
                    div.innerHTML = `
                        &lt;div class=&quot;flex items-center justify-between&quot;&gt;
                            &lt;span class=&quot;text-xs font-extrabold text-amber-400 font-heading&quot;&gt;${item.title}&lt;/span&gt;
                            &lt;span class=&quot;text-[10px] bg-slate-900 border border-slate-700 text-sky-300 px-2.5 py-0.5 rounded-full font-semibold&quot;&gt;${item.tag}&lt;/span&gt;
                        &lt;/div&gt;
                        &lt;p class=&quot;text-xs md:text-sm text-slate-200 leading-relaxed&quot;&gt;${item.scenario}&lt;/p&gt;
                        &lt;details class=&quot;group&quot;&gt;
                            &lt;summary class=&quot;text-xs font-bold text-sky-400 cursor-pointer hover:text-sky-300 select-none&quot;&gt;
                                🔎 Reveal Step-by-Step Historical / Geographic Breakdown
                            &lt;/summary&gt;
                            &lt;div class=&quot;mt-2 text-xs text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800 leading-relaxed&quot;&gt;
                                ${item.analysis}
                            &lt;/div&gt;
                        &lt;/details&gt;
                    `;
                    container.appendChild(div);
                });
            }

            startJistQuiz() {
                this.launchPractice(this.selectedUltTopic, 25);
            }

            // Flashcards &amp; Vault
            selectVaultCategory(cat) {
                this.selectedVaultTopic = cat;
                this.currentCardIdx = 0;
                this.isFlipped = false;

                document.querySelectorAll(&#x27;.vault-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-300&quot;;
                });
                const active = document.getElementById(`vault-tab-${cat}`);
                if (active) active.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-sky-500 bg-sky-500/20 text-sky-300&quot;;

                this.renderFlashcard();
            }

            getFilteredDeck() {
                const deck = this.flashcardsData[this.selectedVaultTopic] || [];
                if (!this.showOnlyReview) return deck;
                return deck.filter(c =&gt; !this.masteredCards[`${this.selectedVaultTopic}_${c.id}`]);
            }

            renderFlashcard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) {
                    document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `0 / 0`;
                    document.getElementById(&#x27;card-front&#x27;).innerText = `🎉 All 250 Cards Mastered!`;
                    document.getElementById(&#x27;card-back&#x27;).innerText = `Social Studies Scholar!`;
                    document.getElementById(&#x27;card-tip&#x27;).innerText = `Click &quot;Show All&quot; to review the full deck again.`;
                    document.getElementById(&#x27;flashcard-mastered-badge&#x27;).classList.add(&#x27;hidden&#x27;);
                    return;
                }

                if (this.currentCardIdx &gt;= deck.length) this.currentCardIdx = 0;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;
                const isMastered = !!this.masteredCards[cardKey];

                document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `${this.currentCardIdx + 1} / ${deck.length}`;
                document.getElementById(&#x27;card-front&#x27;).innerText = card.front;
                document.getElementById(&#x27;card-back&#x27;).innerText = card.back;
                document.getElementById(&#x27;card-tip&#x27;).innerText = card.tip;

                const badge = document.getElementById(&#x27;flashcard-mastered-badge&#x27;);
                if (isMastered) badge.classList.remove(&#x27;hidden&#x27;);
                else badge.classList.add(&#x27;hidden&#x27;);

                document.getElementById(&#x27;btn-toggle-mastery&#x27;).innerText = isMastered ? &quot;Unmark Mastered&quot; : &quot;Mark as Mastered&quot;;

                const flipper = document.getElementById(&#x27;flashcard-flipper&#x27;);
                flipper.style.transform = &#x27;rotateY(0deg)&#x27;;
                this.isFlipped = false;
            }

            jumpToCard(num) {
                const deck = this.getFilteredDeck();
                const idx = parseInt(num, 10) - 1;
                if (!isNaN(idx) &amp;&amp; idx &gt;= 0 &amp;&amp; idx &lt; deck.length) {
                    this.currentCardIdx = idx;
                    this.renderFlashcard();
                }
            }

            toggleMastery() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;

                if (this.masteredCards[cardKey]) {
                    delete this.masteredCards[cardKey];
                } else {
                    this.masteredCards[cardKey] = true;
                }
                this.saveData();
                this.renderFlashcard();
            }

            toggleFilterMastered() {
                this.showOnlyReview = !this.showOnlyReview;
                this.currentCardIdx = 0;
                const btn = document.getElementById(&#x27;btn-filter-mastered&#x27;);
                btn.innerText = this.showOnlyReview ? &quot;Unmastered Only&quot; : &quot;Show All&quot;;
                btn.className = this.showOnlyReview
                    ? &quot;px-3 py-2 bg-sky-500/20 text-xs font-bold text-sky-300 border border-sky-500/40 rounded-xl transition&quot;
                    : &quot;px-3 py-2 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                this.renderFlashcard();
            }

            flipCard() {
                const flipper = document.getElementById(&#x27;flashcard-flipper&#x27;);
                this.isFlipped = !this.isFlipped;
                flipper.style.transform = this.isFlipped ? &#x27;rotateY(180deg)&#x27; : &#x27;rotateY(0deg)&#x27;;
            }

            nextCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx + 1) % deck.length;
                this.renderFlashcard();
            }

            prevCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx - 1 + deck.length) % deck.length;
                this.renderFlashcard();
            }

            randomCard() {
                const deck = this.getFilteredDeck();
                if (deck.length &lt;= 1) return;
                this.currentCardIdx = Math.floor(Math.random() * deck.length);
                this.renderFlashcard();
            }
        }

        let app;
        window.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
            app = new SocialStudiesStudyHallExtreme();
            window.app = app;
        });
    &lt;/script&gt;
