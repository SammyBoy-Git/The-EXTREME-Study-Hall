    &lt;/main&gt;

    &lt;!-- Footer --&gt;
    &lt;footer class=&quot;text-center py-6 text-xs text-slate-500 font-medium border-t border-slate-800 bg-slate-950 mt-12&quot;&gt;
        The Math Study Hall: Extreme Prep Edition • Standardized Test Prep &amp; High Achievement Math Training
    &lt;/footer&gt;

    &lt;!-- App Engine Logic --&gt;
    &lt;script&gt;
        class MathStudyHallExtreme {
            constructor() {
                this.activeTab = &#x27;dashboard&#x27;;
                this.categories = [&#x27;addition&#x27;, &#x27;subtraction&#x27;, &#x27;multiplication&#x27;, &#x27;division&#x27;, &#x27;squareroots&#x27;, &#x27;exponents&#x27;, &#x27;pemdas&#x27;, &#x27;advanced&#x27;];
                
                // Active Quiz State
                this.currentTrack = null;
                this.currentQIndex = 0;
                this.quizQuestions = [];
                this.userScore = 0;
                this.isRushMode = false;
                this.rushTimer = null;
                this.timeLeft = 15;

                // Ultimate Hub State
                this.selectedUltTopic = &#x27;multiplication&#x27;;
                this.examplesData = {};

                // Vault Flashcard State
                this.selectedVaultTopic = &#x27;squareroots&#x27;;
                this.flashcardsData = {};
                this.masteredCards = {}; // Key: cat_idx
                this.showOnlyReview = false;
                this.currentCardIdx = 0;
                this.isFlipped = false;

                // User Local Progress
                this.progress = {};
                this.globalStars = 0;
                this.globalStreak = 0;

                this.initData();
                this.generateQuestions();
                this.generateWorkedExamples();
                this.init250FlashcardsData();
                
                this.updateUI();
                this.selectUltimateTopic(&#x27;multiplication&#x27;);
                this.selectVaultCategory(&#x27;squareroots&#x27;);
            }

            // LocalStorage Handling
            initData() {
                const saved = localStorage.getItem(&#x27;math_hall_extreme_prep_v1&#x27;);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        this.progress = parsed.progress || {};
                        this.globalStars = parsed.globalStars || 0;
                        this.globalStreak = parsed.globalStreak || 0;
                        this.masteredCards = parsed.masteredCards || {};
                    } catch(e) { this.progress = {}; this.masteredCards = {}; }
                }
                this.categories.forEach(c =&gt; {
                    if (!this.progress[c]) {
                        this.progress[c] = { completed: 0, highStreak: 0 };
                    }
                });
            }

            saveData() {
                localStorage.setItem(&#x27;math_hall_extreme_prep_v1&#x27;, JSON.stringify({
                    progress: this.progress,
                    globalStars: this.globalStars,
                    globalStreak: this.globalStreak,
                    masteredCards: this.masteredCards
                }));
                this.updateUI();
            }

            resetData() {
                if (confirm(&#x27;Are you sure you want to reset all progress, stars, and mastered cards?&#x27;)) {
                    localStorage.removeItem(&#x27;math_hall_extreme_prep_v1&#x27;);
                    this.progress = {};
                    this.globalStars = 0;
                    this.globalStreak = 0;
                    this.masteredCards = {};
                    this.initData();
                    this.updateUI();
                    this.renderFlashcard();
                }
            }

            // Helper random generator
            rnd(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // Generates 250 Questions per category (2,000 Total Questions)
            generateQuestions() {
                this.allQuestions = {};
                this.categories.forEach(cat =&gt; {
                    let questions = [];
                    for (let i = 1; i &lt;= 250; i++) {
                        let q = { prompt: &#x27;&#x27;, math: &#x27;&#x27;, ans: 0, isRemainder: false, quotient: 0, remainder: 0, explanation: &#x27;&#x27; };
                        
                        if (cat === &#x27;addition&#x27;) {
                            let a = this.rnd(1000, 99999);
                            let b = this.rnd(1000, 99999);
                            q.prompt = &quot;Solve the addition problem by adding column by column from right to left.&quot;;
                            q.math = `${a.toLocaleString()} + ${b.toLocaleString()} = ?`;
                            q.ans = a + b;
                            q.explanation = `${a.toLocaleString()} + ${b.toLocaleString()} = ${(a + b).toLocaleString()}. Start from ones place and carry over values over 9.`;
                        } else if (cat === &#x27;subtraction&#x27;) {
                            let a = this.rnd(10000, 99999);
                            let b = this.rnd(1000, a - 100);
                            q.prompt = &quot;Solve the multi-digit subtraction problem. Regroup when needed.&quot;;
                            q.math = `${a.toLocaleString()} − ${b.toLocaleString()} = ?`;
                            q.ans = a - b;
                            q.explanation = `${a.toLocaleString()} − ${b.toLocaleString()} = ${(a - b).toLocaleString()}.`;
                        } else if (cat === &#x27;multiplication&#x27;) {
                            let a = this.rnd(12, 99);
                            let b = this.rnd(12, 99);
                            q.prompt = &quot;Multiply the two numbers using standard algorithm or area model.&quot;;
                            q.math = `${a} × ${b} = ?`;
                            q.ans = a * b;
                            q.explanation = `${a} × ${b} = ${a * b}. Break into (${Math.floor(a/10)*10} + ${a%10}) × ${b} to check easily!`;
                        } else if (cat === &#x27;division&#x27;) {
                            let div = this.rnd(3, 9);
                            let quo = this.rnd(12, 99);
                            let rem = (i % 3 === 0) ? this.rnd(1, div - 1) : 0;
                            let dividend = div * quo + rem;
                            if (rem &gt; 0) {
                                q.isRemainder = true;
                                q.quotient = quo;
                                q.remainder = rem;
                                q.prompt = &quot;Solve the division problem. Enter both Quotient (Q) and Remainder (R).&quot;;
                                q.math = `${dividend} ÷ ${div} = ?`;
                                q.explanation = `${dividend} ÷ ${div} = Quotient ${quo} with Remainder ${rem} because (${div} × ${quo}) + ${rem} = ${dividend}.`;
                            } else {
                                q.prompt = &quot;Solve the exact division problem.&quot;;
                                q.math = `${dividend} ÷ ${div} = ?`;
                                q.ans = quo;
                                q.explanation = `${dividend} ÷ ${div} = ${quo}.`;
                            }
                        } else if (cat === &#x27;squareroots&#x27;) {
                            let root = (i % 20) + 1;
                            let sq = root * root;
                            q.prompt = &quot;Find the square root of the perfect square.&quot;;
                            q.math = `√${sq} = ?`;
                            q.ans = root;
                            q.explanation = `√${sq} = ${root} because ${root} × ${root} = ${sq}.`;
                        } else if (cat === &#x27;exponents&#x27;) {
                            if (i % 2 === 0) {
                                let p = (i % 5) + 1;
                                q.prompt = &quot;Evaluate the power of 10.&quot;;
                                q.math = `10^${p} = ?`;
                                q.ans = Math.pow(10, p);
                                q.explanation = `10^${p} equals 1 followed by ${p} zeros = ${Math.pow(10, p).toLocaleString()}.`;
                            } else {
                                let base = this.rnd(2, 5);
                                let exp = this.rnd(2, 4);
                                q.prompt = &quot;Evaluate the exponential expression.&quot;;
                                q.math = `${base}^${exp} = ?`;
                                q.ans = Math.pow(base, exp);
                                q.explanation = `${base}^${exp} = ${Array(exp).fill(base).join(&#x27; × &#x27;)} = ${Math.pow(base, exp)}.`;
                            }
                        } else if (cat === &#x27;pemdas&#x27;) {
                            let a = this.rnd(2, 10);
                            let b = this.rnd(2, 8);
                            let c = this.rnd(2, 6);
                            q.prompt = &quot;Solve following Order of Operations (PEMDAS: Parentheses first).&quot;;
                            q.math = `(${a} + ${b}) × ${c} = ?`;
                            q.ans = (a + b) * c;
                            q.explanation = `First evaluate parentheses: (${a} + ${b}) = ${a + b}. Then multiply: ${a + b} × ${c} = ${(a + b) * c}.`;
                        } else if (cat === &#x27;advanced&#x27;) {
                            let side = (i % 25) + 2;
                            q.prompt = &quot;Find the area of a square with given side length.&quot;;
                            q.math = `Side = ${side} units. Area = ?`;
                            q.ans = side * side;
                            q.explanation = `Area of a square = side × side = ${side} × ${side} = ${side * side} square units.`;
                        }
                        questions.push(q);
                    }
                    this.allQuestions[cat] = questions;
                });
            }

            // Generates 250 Worked Examples per topic
            generateWorkedExamples() {
                this.examplesData = {};
                this.categories.forEach(cat =&gt; {
                    let list = [];
                    for (let i = 1; i &lt;= 250; i++) {
                        let ex = { title: &#x27;&#x27;, problem: &#x27;&#x27;, solution: &#x27;&#x27;, keyTip: &#x27;&#x27; };
                        if (cat === &#x27;addition&#x27;) {
                            let a = i * 125 + 340;
                            let b = i * 85 + 190;
                            ex.title = `Example #${i}: Multi-Digit Addition`;
                            ex.problem = `Find the sum of ${a.toLocaleString()} and ${b.toLocaleString()}.`;
                            ex.solution = `${a.toLocaleString()} + ${b.toLocaleString()} = ${(a + b).toLocaleString()}. Line up digits in ones, tens, hundreds place.`;
                            ex.keyTip = &quot;Column Align&quot;;
                        } else if (cat === &#x27;subtraction&#x27;) {
                            let a = i * 200 + 1000;
                            let b = i * 75 + 250;
                            ex.title = `Example #${i}: Regrouping Subtraction`;
                            ex.problem = `Subtract ${b.toLocaleString()} from ${a.toLocaleString()}.`;
                            ex.solution = `${a.toLocaleString()} − ${b.toLocaleString()} = ${(a - b).toLocaleString()}.`;
                            ex.keyTip = &quot;Borrowing&quot;;
                        } else if (cat === &#x27;multiplication&#x27;) {
                            let a = (i % 30) + 11;
                            let b = (i % 15) + 12;
                            ex.title = `Example #${i}: Partial Products`;
                            ex.problem = `Calculate ${a} × ${b}.`;
                            ex.solution = `${a} × ${b} = ${a * b}. Break down into tens and ones for quick mental calculation.`;
                            ex.keyTip = &quot;Area Model&quot;;
                        } else if (cat === &#x27;division&#x27;) {
                            let div = (i % 7) + 3;
                            let quo = (i % 40) + 10;
                            ex.title = `Example #${i}: Division Model`;
                            ex.problem = `Divide ${div * quo} by ${div}.`;
                            ex.solution = `${div * quo} ÷ ${div} = ${quo}. Check: ${div} × ${quo} = ${div * quo}.`;
                            ex.keyTip = &quot;Inverse Mult&quot;;
                        } else if (cat === &#x27;squareroots&#x27;) {
                            let root = (i % 20) + 1;
                            ex.title = `Example #${i}: Perfect Square`;
                            ex.problem = `What is the value of √${root * root}?`;
                            ex.solution = `√${root * root} = ${root} because ${root} × ${root} = ${root * root}.`;
                            ex.keyTip = &quot;Square Roots&quot;;
                        } else if (cat === &#x27;exponents&#x27;) {
                            let pow = (i % 5) + 1;
                            ex.title = `Example #${i}: Power of 10`;
                            ex.problem = `Simplify 10^${pow}.`;
                            ex.solution = `10^${pow} = ${Math.pow(10, pow).toLocaleString()} (1 followed by ${pow} zeros).`;
                            ex.keyTip = &quot;Base 10&quot;;
                        } else if (cat === &#x27;pemdas&#x27;) {
                            let a = (i % 10) + 2;
                            let b = (i % 5) + 1;
                            ex.title = `Example #${i}: Order of Operations`;
                            ex.problem = `Evaluate (${a} + 5) × ${b}.`;
                            ex.solution = `Step 1: (${a} + 5) = ${a + 5}. Step 2: ${a + 5} × ${b} = ${(a + 5) * b}.`;
                            ex.keyTip = &quot;PEMDAS&quot;;
                        } else if (cat === &#x27;advanced&#x27;) {
                            let w = (i % 15) + 2;
                            let h = (i % 10) + 3;
                            ex.title = `Example #${i}: Perimeter Calculation`;
                            ex.problem = `Find the perimeter of a rectangle with length ${w} and width ${h}.`;
                            ex.solution = `Perimeter = 2 × (${w} + ${h}) = 2 × ${w + h} = ${2 * (w + h)} units.`;
                            ex.keyTip = &quot;Perimeter&quot;;
                        }
                        list.push(ex);
                    }
                    this.examplesData[cat] = list;
                });
            }

            // Generates 250 flashcards for ALL 8 topics (2,000 Flashcards Total)
            init250FlashcardsData() {
                this.flashcardsData = {};
                
                this.categories.forEach(cat =&gt; {
                    let deck = [];
                    for (let i = 1; i &lt;= 250; i++) {
                        let card = { id: i, front: &#x27;&#x27;, back: &#x27;&#x27;, tip: &#x27;&#x27; };

                        if (cat === &#x27;addition&#x27;) {
                            let a = this.rnd(120, 999);
                            let b = this.rnd(85, 950);
                            card.front = `${a.toLocaleString()} + ${b.toLocaleString()} = ?`;
                            card.back = `${(a + b).toLocaleString()}`;
                            card.tip = `Addition Rule: Align columns right-to-left. Regroup when sum is ≥ 10.`;
                        } else if (cat === &#x27;subtraction&#x27;) {
                            let a = this.rnd(500, 9999);
                            let b = this.rnd(100, a - 50);
                            card.front = `${a.toLocaleString()} − ${b.toLocaleString()} = ?`;
                            card.back = `${(a - b).toLocaleString()}`;
                            card.tip = `Subtraction Rule: Regroup/borrow from the next column to the left if top digit &lt; bottom digit.`;
                        } else if (cat === &#x27;multiplication&#x27;) {
                            let a = (i % 12) + 1;
                            let b = this.rnd(2, 12);
                            if (i % 2 === 0) {
                                a = this.rnd(15, 99);
                                b = this.rnd(11, 25);
                            }
                            card.front = `${a} × ${b} = ?`;
                            card.back = `${a * b}`;
                            card.tip = `Multiplication Rule: Use area model (Break into tens &amp; ones) or distributive property!`;
                        } else if (cat === &#x27;division&#x27;) {
                            let div = this.rnd(3, 12);
                            let quo = this.rnd(4, 50);
                            let rem = (i % 4 === 0) ? 0 : this.rnd(1, div - 1);
                            let dividend = div * quo + rem;
                            card.front = `${dividend} ÷ ${div} = ?`;
                            card.back = rem === 0 ? `Q = ${quo}` : `Q = ${quo}, R = ${rem}`;
                            card.tip = `Division Rule: Divide, Multiply, Subtract, Bring down (DMSB).`;
                        } else if (cat === &#x27;squareroots&#x27;) {
                            let root = (i % 20) + 1; // 1 to 20
                            let sq = root * root;
                            card.front = `√${sq} = ?`;
                            card.back = `${root}`;
                            card.tip = `${root} × ${root} = ${sq}. Square root undoes squaring a number!`;
                        } else if (cat === &#x27;exponents&#x27;) {
                            if (i % 2 === 0) {
                                let pow = (i % 6) + 1;
                                card.front = `10^${pow} = ?`;
                                card.back = `${Math.pow(10, pow).toLocaleString()}`;
                                card.tip = `10 to the power of ${pow} has a 1 followed by exactly ${pow} zeros!`;
                            } else {
                                let base = (i % 4) + 2;
                                let exp = (i % 3) + 2;
                                card.front = `${base}^${exp} = ?`;
                                card.back = `${Math.pow(base, exp)}`;
                                card.tip = `${base}^${exp} means multiply ${base} by itself ${exp} times.`;
                            }
                        } else if (cat === &#x27;pemdas&#x27;) {
                            let a = (i % 8) + 2;
                            let b = (i % 5) + 2;
                            let c = (i % 4) + 1;
                            let ans = (a + b) * c;
                            card.front = `(${a} + ${b}) × ${c} = ?`;
                            card.back = `${ans}`;
                            card.tip = `PEMDAS: Parentheses FIRST! ${a}+${b}=${a+b}, then multiply by ${c}.`;
                        } else if (cat === &#x27;advanced&#x27;) {
                            let num = (i % 10) + 1;
                            card.front = `Simplify or Equivalent: ${num}/5 = ?/20`;
                            card.back = `${num * 4}`;
                            card.tip = `Multiply both numerator and denominator by 4 to get equivalent fraction over 20.`;
                        }

                        deck.push(card);
                    }
                    this.flashcardsData[cat] = deck;
                });

                this.strategyCardsData = {
                    addition: [{ title: &#x27;💡 Column Regrouping&#x27;, body: &#x27;When adding numbers, start from the ones column. Carry any value over 9 to the tens column.&#x27; }],
                    subtraction: [{ title: &#x27;⚡ Borrowing Across Zeros&#x27;, body: &#x27;If you need to borrow from 0, go left until you find a non-zero digit, borrow 1, and change intervening zeros to 9s.&#x27; }],
                    multiplication: [{ title: &#x27;🧩 Area Model Shortcut&#x27;, body: &#x27;Break 24 × 15 into (20+4) × (10+5). Multiply the four sub-boxes and add the results!&#x27; }],
                    division: [{ title: &#x27;➗ Long Division Mnemonic&#x27;, body: &#x27;Does McDonald\&#x27;s Serve Cheeseburgers? Divide, Multiply, Subtract, Check, Bring Down!&#x27; }],
                    squareroots: [{ title: &#x27;💡 Visual Square Grid&#x27;, body: &#x27;A square root asks for the side length of a square. If area = 64, side = √64 = 8.&#x27; }],
                    exponents: [{ title: &#x27;🚀 Powers of 10 Rule&#x27;, body: &#x27;The exponent tells you the exact number of zeros after the 1. E.g., 10⁵ = 100,000.&#x27; }],
                    pemdas: [{ title: &#x27;📜 Order of Operations&#x27;, body: &#x27;P → E → MD (Left-to-Right) → AS (Left-to-Right). Parentheses always outrank everything!&#x27; }],
                    advanced: [{ title: &#x27;🧩 Equivalent Fractions&#x27;, body: &#x27;Multiply or divide top and bottom by the exact same non-zero number to preserve value.&#x27; }]
                };
            }

            // Tab Switching Navigation
            switchTab(tab) {
                this.activeTab = tab;
                document.querySelectorAll(&#x27;main &gt; section&#x27;).forEach(s =&gt; s.classList.add(&#x27;hidden&#x27;));
                document.getElementById(`tab-${tab}`).classList.remove(&#x27;hidden&#x27;);

                // Button styling
                [&#x27;dashboard&#x27;, &#x27;ultimate&#x27;, &#x27;vault&#x27;].forEach(t =&gt; {
                    const btn = document.getElementById(`nav-${t}-btn`);
                    if (t === tab) {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-md&quot;;
                    } else {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50&quot;;
                    }
                });

                if (tab === &#x27;dashboard&#x27;) {
                    document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.add(&#x27;hidden&#x27;);
                    document.getElementById(&#x27;tab-dashboard&#x27;).classList.remove(&#x27;hidden&#x27;);
                }
            }

            // Dashboard UI Updater
            updateUI() {
                let totalCompleted = 0;
                let totalPossible = this.categories.length * 250;

                this.categories.forEach(cat =&gt; {
                    let prog = this.progress[cat] || { completed: 0 };
                    totalCompleted += prog.completed;
                    let pct = Math.min(100, Math.round((prog.completed / 250) * 100));

                    let txt = document.getElementById(`prog-text-${cat}`);
                    let bar = document.getElementById(`prog-bar-${cat}`);
                    let pctTxt = document.getElementById(`prog-pct-${cat}`);

                    if (txt) txt.innerText = `${prog.completed} / 250`;
                    if (pctTxt) pctTxt.innerText = `${pct}%`;
                    if (bar) bar.style.width = `${pct}%`;
                });

                document.getElementById(&#x27;global-stars&#x27;).innerText = this.globalStars;
                document.getElementById(&#x27;global-streak&#x27;).innerText = this.globalStreak;

                let overallReadiness = Math.round((totalCompleted / totalPossible) * 100);
                document.getElementById(&#x27;readiness-score-display&#x27;).innerText = `${overallReadiness}%`;
            }

            // Launch Practice Track (250 questions)
            launchPractice(track) {
                this.currentTrack = track;
                this.currentQIndex = 0;
                this.userScore = 0;
                this.quizQuestions = this.allQuestions[track];

                document.getElementById(&#x27;tab-dashboard&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.remove(&#x27;hidden&#x27;);

                document.getElementById(&#x27;arena-track-title&#x27;).innerText = `${track.toUpperCase()} PREP TRACK`;
                this.loadArenaQuestion();
            }

            // Rush Mode Toggle
            toggleRushMode() {
                this.isRushMode = !this.isRushMode;
                const btn = document.getElementById(&#x27;toggle-rush-mode&#x27;);
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);

                if (this.isRushMode) {
                    btn.className = &quot;px-3 py-1 bg-rose-500 text-xs font-bold text-white border border-rose-400 rounded-xl shadow-md&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: ON&quot;;
                    timerDisp.classList.remove(&#x27;hidden&#x27;);
                    this.startRushTimer();
                } else {
                    btn.className = &quot;px-3 py-1 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: OFF&quot;;
                    timerDisp.classList.add(&#x27;hidden&#x27;);
                    clearInterval(this.rushTimer);
                }
            }

            startRushTimer() {
                clearInterval(this.rushTimer);
                this.timeLeft = 15;
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);
                timerDisp.innerText = `${this.timeLeft}s`;

                this.rushTimer = setInterval(() =&gt; {
                    this.timeLeft--;
                    timerDisp.innerText = `${this.timeLeft}s`;
                    if (this.timeLeft &lt;= 0) {
                        clearInterval(this.rushTimer);
                        this.submitPracticeAnswer(true); // Forced timeout
                    }
                }, 1000);
            }

            loadArenaQuestion() {
                const q = this.quizQuestions[this.currentQIndex];
                document.getElementById(&#x27;arena-track-subtitle&#x27;).innerText = `Question ${this.currentQIndex + 1} of ${this.quizQuestions.length}`;
                document.getElementById(&#x27;arena-prompt&#x27;).innerText = q.prompt;
                document.getElementById(&#x27;arena-math-box&#x27;).innerText = q.math;

                // Reset inputs
                document.getElementById(&#x27;user-ans-input&#x27;).value = &#x27;&#x27;;
                document.getElementById(&#x27;user-quotient-input&#x27;).value = &#x27;&#x27;;
                document.getElementById(&#x27;user-remainder-input&#x27;).value = &#x27;&#x27;;

                document.getElementById(&#x27;arena-feedback-box&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-input-container&#x27;).classList.remove(&#x27;hidden&#x27;);

                if (q.isRemainder) {
                    document.getElementById(&#x27;input-mode-standard&#x27;).classList.add(&#x27;hidden&#x27;);
                    document.getElementById(&#x27;input-mode-remainder&#x27;).classList.remove(&#x27;hidden&#x27;);
                } else {
                    document.getElementById(&#x27;input-mode-standard&#x27;).classList.remove(&#x27;hidden&#x27;);
                    document.getElementById(&#x27;input-mode-remainder&#x27;).classList.add(&#x27;hidden&#x27;);
                }

                if (this.isRushMode) this.startRushTimer();
            }

            submitPracticeAnswer(isTimeout = false) {
                clearInterval(this.rushTimer);
                const q = this.quizQuestions[this.currentQIndex];
                let isCorrect = false;

            prevCard() {

                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx - 1 + deck.length) % deck.length;
                this.renderFlashcard();

                    `;
                    container.appendChild(card);
                });
            }

                // Ultimate Hub State
                this.selectedUltTopic = &#x27;vocab&#x27;;
                this.examplesPage = 0;
                this.examplesPerPage = 10;

                // Vault State
                this.selectedVaultTopic = &#x27;vocab&#x27;;
                this.currentCardIdx = 0;
                this.isFlipped = false;
                this.showOnlyReview = false;

                // Saved State
                this.progress = {};
                this.globalStars = 0;
                this.globalStreak = 0;
                this.masteredCards = {};

                this.initData();
                this.buildContentBanks();
                this.updateUI();
                this.selectUltimateTopic(&#x27;vocab&#x27;);
                this.selectVaultCategory(&#x27;vocab&#x27;);
            }

            initData() {
                const saved = localStorage.getItem(&#x27;reading_hall_extreme_v1&#x27;);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        this.progress = parsed.progress || {};
                        this.globalStars = parsed.globalStars || 0;
                        this.globalStreak = parsed.globalStreak || 0;
                        this.masteredCards = parsed.masteredCards || {};
                    } catch (e) {
                        this.progress = {};
                    }
                }
                this.categories.forEach(c =&gt; {
                    if (!this.progress[c]) this.progress[c] = { completed: 0 };
                });
            }

            saveData() {
                localStorage.setItem(&#x27;reading_hall_extreme_v1&#x27;, JSON.stringify({
                    progress: this.progress,
                    globalStars: this.globalStars,
                    globalStreak: this.globalStreak,
                    masteredCards: this.masteredCards
                }));
                this.updateUI();
            }

            showResetModal() {
                document.getElementById(&#x27;reset-modal&#x27;).classList.remove(&#x27;hidden&#x27;);
            }

            hideResetModal() {
                document.getElementById(&#x27;reset-modal&#x27;).classList.add(&#x27;hidden&#x27;);
            }

            confirmResetData() {
                localStorage.removeItem(&#x27;reading_hall_extreme_v1&#x27;);
                this.progress = {};
                this.globalStars = 0;
                this.globalStreak = 0;
                this.masteredCards = {};
                this.initData();
                this.updateUI();
                this.renderFlashcard();
                this.hideResetModal();
            }

            // Deterministic pseudo-random helper so items 1..250 stay consistent across sessions
            seededRand(seed) {
                let x = Math.sin(seed * 9999.91) * 10000;
                return x - Math.floor(x);
            }

            shuffleWithSeed(arr, seed) {
                let copy = [...arr];
                for (let i = copy.length - 1; i &gt; 0; i--) {
                    const j = Math.floor(this.seededRand(seed + i) * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            // Builds 250 questions, 250 worked examples, and 250 flashcards for all 8 categories (6,000 items total)
            buildContentBanks() {
                this.allQuestions = {};
                this.examplesData = {};
                this.flashcardsData = {};

                // Rich Seed Banks per Category
                const vocabBank = [
                    { word: &quot;meticulous&quot;, def: &quot;showing great attention to detail; very careful&quot;, opp: &quot;careless&quot;, ctx: &quot;Maya was meticulous when painting the miniature model, checking every tiny brushstroke twice.&quot; },
                    { word: &quot;resilient&quot;, def: &quot;able to recover quickly from difficult conditions&quot;, opp: &quot;fragile&quot;, ctx: &quot;Even after the fierce storm flattened the meadow, the resilient wildflowers stood tall again within days.&quot; },
                    { word: &quot;scarce&quot;, def: &quot;insufficient for the demand; in short supply&quot;, opp: &quot;abundant&quot;, ctx: &quot;During the dry desert summer, fresh water becomes scarce, forcing animals to travel miles for a drink.&quot; },
                    { word: &quot;reluctant&quot;, def: &quot;unwilling and hesitant; disinclined&quot;, opp: &quot;eager&quot;, ctx: &quot;Leo was reluctant to dive off the high board, gripping the ladder tightly before finally jumping.&quot; },
                    { word: &quot;benevolent&quot;, def: &quot;well-meaning, kind, and generous&quot;, opp: &quot;cruel&quot;, ctx: &quot;The benevolent baker donated loaves of warm bread to the neighborhood shelter every evening.&quot; },
                    { word: &quot;treacherous&quot;, def: &quot;guilty of betrayal or presenting hidden dangers&quot;, opp: &quot;safe&quot;, ctx: &quot;Hikers avoided the treacherous mountain trail because loose rocks and steep cliffs made it hazardous.&quot; },
                    { word: &quot;plausible&quot;, def: &quot;seeming reasonable or probable&quot;, opp: &quot;impossible&quot;, ctx: &quot;Her explanation for why the laboratory beaker broke was plausible, so the science teacher believed her.&quot; },
                    { word: &quot;obsolete&quot;, def: &quot;no longer produced or used; out of date&quot;, opp: &quot;modern&quot;, ctx: &quot;Once smartphones became common, paper road maps and floppy disks quickly became obsolete.&quot; },
                    { word: &quot;gregarious&quot;, def: &quot;fond of company; sociable and outgoing&quot;, opp: &quot;shy&quot;, ctx: &quot;Unlike his quiet brother, Marcus is gregarious and makes new friends within minutes at every camp.&quot; },
                    { word: &quot;diligent&quot;, def: &quot;having or showing care and conscientiousness in one&#x27;s work&quot;, opp: &quot;lazy&quot;, ctx: &quot;Through diligent daily practice on the piano, Elena mastered the complex concerto before the recital.&quot; },
                    { word: &quot;ambiguous&quot;, def: &quot;open to more than one interpretation; unclear&quot;, opp: &quot;crystal-clear&quot;, ctx: &quot;The treasure map&#x27;s ambiguous directions left the explorers arguing over whether to turn north or east.&quot; },
                    { word: &quot;ferocious&quot;, def: &quot;savagely fierce, cruel, or violent&quot;, opp: &quot;gentle&quot;, ctx: &quot;A ferocious blizzard howled outside the cabin, shaking the shutters with 60-mile-per-hour winds.&quot; },
                    { word: &quot;frugal&quot;, def: &quot;sparing or economical with regard to money or food&quot;, opp: &quot;wasteful&quot;, ctx: &quot;By being frugal and packing homemade lunches instead of buying snacks, Sam saved enough for a new bike.&quot; },
                    { word: &quot;ominous&quot;, def: &quot;giving the impression that something bad is going to happen&quot;, opp: &quot;encouraging&quot;, ctx: &quot;Dark, ominous clouds gathered rapidly on the horizon, warning the sailors to head back to port.&quot; },
                    { word: &quot;vivid&quot;, def: &quot;producing powerful feelings or strong, clear images in the mind&quot;, opp: &quot;dull&quot;, ctx: &quot;The author&#x27;s vivid description of the neon coral reef made readers feel as if they were scuba diving.&quot; },

                            const item = figBank[(i - 1) % figBank.length];
                            const allTypes = [&quot;Simile&quot;, &quot;Metaphor&quot;, &quot;Personification&quot;, &quot;Hyperbole&quot;, &quot;Idiom&quot;, &quot;Alliteration&quot;, &quot;Onomatopoeia&quot;];
                            const distractors = allTypes.filter(t =&gt; t !== item.type).slice(0, 3);
                            const opts = this.shuffleWithSeed([item.type, ...distractors], seed);

                            qList.push({
                                id: i,
                                badge: `Literary Device • #${i}`,
                                passage: `&quot;${item.text}&quot;`,
                                question: `Which type of figurative language is used in the sentence above?`,
                                options: opts,
                                correctIndex: opts.indexOf(item.type),
                                explanation: `Correct Device: ${item.type}. ${item.clue}`
                            });

                            exList.push({
                                id: i,
                                title: `Example #${i}: Identifying ${item.type}`,
                                tag: item.type,
                                passage: `&quot;${item.text}&quot;`,
                                analysis: `Device: ${item.type}. Clue: ${item.clue}`
                            });

                            fcList.push({
                                id: i,
                                front: `Identify Device:\n&quot;${item.text}&quot;`,
                                back: item.type,
                                tip: item.clue
                            });
                        }

                        else if (cat === &#x27;mainidea&#x27;) {
                            const item = mainIdeaBank[(i - 1) % mainIdeaBank.length];
                            const opts = this.shuffleWithSeed([item.main, item.d1, item.d2, item.d3], seed);

                            qList.push({
                                id: i,
                                badge: `Central Theme • #${i}`,
                                passage: item.passage,
                                question: `What is the MAIN IDEA of this passage?`,
                                options: opts,
                                correctIndex: opts.indexOf(item.main),
                                explanation: `The central point supported by every sentence in the passage is: &quot;${item.main}&quot;. The other choices are either false or minor unsupported details.`
                            });

                            exList.push({
                                id: i,
                                title: `Example #${i}: Finding the Central Idea`,
                                tag: &quot;Main Idea&quot;,
                                passage: item.passage,
                                analysis: `Main Idea: &quot;${item.main}&quot;. Tip: Ask yourself, &quot;What is the whole paragraph mostly about?&quot; rather than focusing on a single small detail.`
                            });

                            fcList.push({
                                id: i,
                                front: `Main Idea Check:\n${item.passage.slice(0, 115)}...`,
                                back: item.main,
                                tip: `Always look at the first and last sentences for topic clues!`
                            });
                        }

                        else if (cat === &#x27;inference&#x27;) {
                            const item = inferenceBank[(i - 1) % inferenceBank.length];
                            const opts = this.shuffleWithSeed([item.ans, item.w1, item.w2, item.w3], seed);

                            qList.push({
                                id: i,
                                badge: `Reading Between Lines • #${i}`,
                                passage: item.passage,
                                question: `What is the most logical inference you can draw from this scene?`,
                                options: opts,
                                correctIndex: opts.indexOf(item.ans),
                                explanation: `Inference Formula (Text Clues + Background Knowledge): ${item.ans}`
                            });

                            exList.push({
                                id: i,
                                title: `Example #${i}: Evidence + Schema`,
                                tag: &quot;Inference&quot;,
                                passage: item.passage,
                                analysis: `Logical Conclusion: ${item.ans}. Even though the author didn&#x27;t state it word-for-word, the sensory clues prove it.`
                            });

                            fcList.push({
                                id: i,
                                front: `What can you infer?\n&quot;${item.passage}&quot;`,
                                back: item.ans,
                                tip: `Inference = Text Clues + What You Already Know.`
                            });
                        }

                        else if (cat === &#x27;structure&#x27;) {
                            const item = structureBank[(i - 1) % structureBank.length];
                            const allStructs = [&quot;Cause &amp; Effect&quot;, &quot;Compare &amp; Contrast&quot;, &quot;Chronological Sequence&quot;, &quot;Problem &amp; Solution&quot;, &quot;Description&quot;];
                            const distractors = allStructs.filter(s =&gt; s !== item.type).slice(0, 3);
                            const opts = this.shuffleWithSeed([item.type, ...distractors], seed);

                            qList.push({
                                id: i,
                                badge: `Text Structure • #${i}`,
                                passage: item.passage,
                                question: item.q,
                                options: opts,
                                correctIndex: opts.indexOf(item.type),
                                explanation: `Structure: ${item.type}. ${item.clue}`
                            });

                            exList.push({
                                id: i,
                                title: `Example #${i}: ${item.type}`,
                                tag: item.type,
                                passage: item.passage,
                                analysis: `Structure: ${item.type}. Signal Clue: ${item.clue}`
                            });

                            fcList.push({
                                id: i,
                                front: `Identify Structure:\n&quot;${item.passage}&quot;`,
                                back: item.type,
                                tip: item.clue
                            });
                        }

                        else if (cat === &#x27;purpose&#x27;) {
                            const item = purposeBank[(i - 1) % purposeBank.length];
                            const opts = this.shuffleWithSeed([
                                `To ${item.purpose} (${item.tone})`,
                                &quot;To Criticize Angry Readers&quot;,
                                &quot;To Confuse the Audience with Riddles&quot;,
                                &quot;To List Random Dictionary Definitions&quot;
                            ], seed);

                            qList.push({
                                id: i,
                                badge: `Author&#x27;s Craft • #${i}`,
                                passage: item.passage,
                                question: `What is the author&#x27;s primary purpose and tone in this passage?`,
                                options: opts,
                                correctIndex: opts.indexOf(`To ${item.purpose} (${item.tone})`),
                                explanation: `Purpose: To ${item.purpose} | Tone: ${item.tone}. ${item.clue}`
                            });

                            exList.push({
                                id: i,
                                title: `Example #${i}: Purpose = ${item.purpose}`,
                                tag: item.purpose,
                                passage: item.passage,
                                analysis: `Purpose: To ${item.purpose} (Tone: ${item.tone}). Why? ${item.clue}`
                            });

                            fcList.push({
                                id: i,
                                front: `Author&#x27;s Purpose?\n&quot;${item.passage}&quot;`,
                                back: `To ${item.purpose} (${item.tone})`,
                                tip: item.clue
                            });
                        }

                        else if (cat === &#x27;grammar&#x27;) {
                            const item = grammarBank[(i - 1) % grammarBank.length];
                            const opts = this.shuffleWithSeed([item.correct, ...item.distractors], seed);

                            qList.push({
                                id: i,
                                badge: `Syntax &amp; Mechanics • #${i}`,
                                passage: item.sentence,
                                question: `Select the grammatically correct option to complete or fix the sentence:`,
                                options: opts,
                                correctIndex: opts.indexOf(item.correct),
                                explanation: `Correct Choice: &quot;${item.correct}&quot;. Grammar Rule: ${item.rule}`
                            });

                            exList.push({
                                id: i,
                                title: `Example #${i}: Mechanics Mastery`,
                                tag: &quot;Grammar Rule&quot;,
                                passage: item.sentence,
                                analysis: `Correct Answer: &quot;${item.correct}&quot;. Rule: ${item.rule}`
                            });

                            fcList.push({
                                id: i,
                                front: `Fix or Complete:\n&quot;${item.sentence}&quot;`,
                                back: item.correct,
                                tip: item.rule
                            });
                        }
                    }

                    this.allQuestions[cat] = qList;
                    this.examplesData[cat] = exList;
                    this.flashcardsData[cat] = fcList;
                });
            }

            // Tab Navigation
            switchTab(tab) {
                clearInterval(this.rushTimer);
                document.querySelectorAll(&#x27;main &gt; section&#x27;).forEach(s =&gt; s.classList.add(&#x27;hidden&#x27;));
                document.getElementById(`tab-${tab}`).classList.remove(&#x27;hidden&#x27;);

                [&#x27;dashboard&#x27;, &#x27;ultimate&#x27;, &#x27;vault&#x27;].forEach(t =&gt; {
                    const btn = document.getElementById(`nav-${t}-btn`);
                    if (t === tab) {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-md&quot;;
                    } else {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-800&quot;;
                    }
                });
            }

            updateUI() {
                let totalCompleted = 0;
                const totalPossible = this.categories.length * 250;

                this.categories.forEach(cat =&gt; {
                    const prog = this.progress[cat] || { completed: 0 };
                    totalCompleted += prog.completed;
                    const pct = Math.min(100, Math.round((prog.completed / 250) * 100));

                    const txt = document.getElementById(`prog-text-${cat}`);
                    const bar = document.getElementById(`prog-bar-${cat}`);
                    const pctTxt = document.getElementById(`prog-pct-${cat}`);

                    if (txt) txt.innerText = `${prog.completed} / 250`;
                    if (pctTxt) pctTxt.innerText = `${pct}%`;
                    if (bar) bar.style.width = `${pct}%`;
                });

                document.getElementById(&#x27;global-stars&#x27;).innerText = this.globalStars;
                document.getElementById(&#x27;global-streak&#x27;).innerText = this.globalStreak;

                const overallReadiness = Math.round((totalCompleted / totalPossible) * 100);
                document.getElementById(&#x27;readiness-score-display&#x27;).innerText = `${overallReadiness}%`;
            }

            // Launch 250-Q Track or 25-Q &quot;Get the Jist&quot; Diagnostic
            launchPractice(track, count = 250) {
                this.currentTrack = track;
                this.isJistMode = (count === 25);
                this.currentQIndex = 0;
                this.questionAnswered = false;

                const fullPool = this.allQuestions[track];
                if (this.isJistMode) {
                    // Pick 25 varied questions spaced across the 250 pool
                    this.quizQuestions = fullPool.filter((_, idx) =&gt; idx % 10 === 0).slice(0, 25);
                } else {
                    this.quizQuestions = fullPool;
                    // Resume from where student left off if under 250
                    const savedCompleted = this.progress[track]?.completed || 0;
                    if (savedCompleted &gt; 0 &amp;&amp; savedCompleted &lt; 250) {
                        this.currentQIndex = savedCompleted;
                    }
                }

                document.querySelectorAll(&#x27;main &gt; section&#x27;).forEach(s =&gt; s.classList.add(&#x27;hidden&#x27;));
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.remove(&#x27;hidden&#x27;);

                document.getElementById(&#x27;arena-track-title&#x27;).innerText = this.categoryNames[track];
                document.getElementById(&#x27;arena-mode-badge&#x27;).innerText = this.isJistMode ? &quot;25-Q DIAGNOSTIC&quot; : &quot;250 TEST TRACK&quot;;
                this.loadArenaQuestion();
            }

            toggleRushMode() {
                this.isRushMode = !this.isRushMode;
                const btn = document.getElementById(&#x27;toggle-rush-mode&#x27;);
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);

                if (this.isRushMode) {
                    btn.className = &quot;px-3 py-1.5 bg-rose-600 text-xs font-bold text-white border border-rose-400 rounded-xl shadow-md&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: ON&quot;;
                    timerDisp.classList.remove(&#x27;hidden&#x27;);
                    if (!this.questionAnswered) this.startRushTimer();
                } else {
                    btn.className = &quot;px-3 py-1.5 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: OFF&quot;;
                    timerDisp.classList.add(&#x27;hidden&#x27;);
                    clearInterval(this.rushTimer);
                }
            }

            startRushTimer() {
                clearInterval(this.rushTimer);
                this.timeLeft = 20;
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);
                timerDisp.innerText = `${this.timeLeft}s`;

                this.rushTimer = setInterval(() =&gt; {
                    this.timeLeft--;
                    timerDisp.innerText = `${this.timeLeft}s`;
                    if (this.timeLeft &lt;= 0) {
                        clearInterval(this.rushTimer);
                        this.selectOption(-1, true);
                    }
                }, 1000);
            }

            loadArenaQuestion() {
                this.questionAnswered = false;
                const q = this.quizQuestions[this.currentQIndex];

                document.getElementById(&#x27;arena-track-subtitle&#x27;).innerText = `Question ${this.currentQIndex + 1} of ${this.quizQuestions.length}`;
                document.getElementById(&#x27;arena-category-badge&#x27;).innerText = q.badge;
                document.getElementById(&#x27;arena-passage-box&#x27;).innerText = q.passage;
                document.getElementById(&#x27;arena-question-text&#x27;).innerText = q.question;

                const grid = document.getElementById(&#x27;arena-options-grid&#x27;);
                grid.innerHTML = &#x27;&#x27;;
                const letters = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];

                q.options.forEach((optText, idx) =&gt; {
                    const btn = document.createElement(&#x27;button&#x27;);
                    btn.id = `opt-btn-${idx}`;
                    btn.onclick = () =&gt; this.selectOption(idx, false);
                    btn.className = &quot;text-left p-4 rounded-2xl bg-slate-900 hover:bg-slate-800 border-2 border-slate-800 hover:border-cyan-500/60 transition-all flex items-start space-x-3 group&quot;;
                    btn.innerHTML = `
                        &lt;span class=&quot;w-7 h-7 rounded-lg bg-slate-800 group-hover:bg-cyan-500 group-hover:text-slate-950 text-cyan-400 font-extrabold text-xs flex items-center justify-center shrink-0 mt-0.5 transition&quot;&gt;${letters[idx]}&lt;/span&gt;
                        &lt;span class=&quot;text-xs md:text-sm text-slate-200 font-medium leading-snug&quot;&gt;${optText}&lt;/span&gt;
                    `;
                    grid.appendChild(btn);
                });

                document.getElementById(&#x27;arena-feedback-box&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);

                if (this.isRushMode) this.startRushTimer();
            }

            selectOption(chosenIdx, isTimeout = false) {
                if (this.questionAnswered) return;
                this.questionAnswered = true;
                clearInterval(this.rushTimer);

                const q = this.quizQuestions[this.currentQIndex];
                const isCorrect = (!isTimeout &amp;&amp; chosenIdx === q.correctIndex);

                // Highlight option buttons
                q.options.forEach((_, idx) =&gt; {
                    const btn = document.getElementById(`opt-btn-${idx}`);
                    btn.disabled = true;
                    if (idx === q.correctIndex) {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-emerald-500/20 border-2 border-emerald-500 flex items-start space-x-3&quot;;
                    } else if (idx === chosenIdx &amp;&amp; !isCorrect) {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-rose-500/20 border-2 border-rose-500 flex items-start space-x-3&quot;;
                    } else {
                        btn.className = &quot;text-left p-4 rounded-2xl bg-slate-900/40 border-2 border-slate-800/50 opacity-50 flex items-start space-x-3&quot;;
                    }
                });

                const feedbackBox = document.getElementById(&#x27;arena-feedback-box&#x27;);
                const feedbackTitle = document.getElementById(&#x27;arena-feedback-title&#x27;);
                const feedbackBody = document.getElementById(&#x27;arena-feedback-body&#x27;);

                feedbackBox.classList.remove(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.remove(&#x27;hidden&#x27;);

                if (isCorrect) {
                    this.globalStars += 5;
                    this.globalStreak++;
                    if (!this.isJistMode) {
                        this.progress[this.currentTrack].completed = Math.min(250, Math.max(this.progress[this.currentTrack].completed, this.currentQIndex + 1));
                    }
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-emerald-500/10 border-emerald-500/40 text-emerald-300&quot;;
                    feedbackTitle.innerText = &quot;🎉 Spot On! +5 XP&quot;;
                    feedbackBody.innerText = q.explanation;
                } else {
                    this.globalStreak = 0;
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-rose-500/10 border-rose-500/40 text-rose-300&quot;;
                    feedbackTitle.innerText = isTimeout ? &quot;⏰ Time Expired!&quot; : &quot;❌ Not Quite — Check the Text Evidence&quot;;
                    feedbackBody.innerText = q.explanation;
                }

                this.saveData();
            }

            nextPracticeQuestion() {
                if (this.currentQIndex &lt; this.quizQuestions.length - 1) {
                    this.currentQIndex++;
                    this.loadArenaQuestion();
                } else {
                    // Show completion banner inside feedback box
                    const feedbackBox = document.getElementById(&#x27;arena-feedback-box&#x27;);
                    const feedbackTitle = document.getElementById(&#x27;arena-feedback-title&#x27;);
                    const feedbackBody = document.getElementById(&#x27;arena-feedback-body&#x27;);
                    feedbackBox.className = &quot;p-5 rounded-2xl space-y-2 text-sm border bg-cyan-500/20 border-cyan-500 text-cyan-200&quot;;
                    feedbackTitle.innerText = &quot;🏆 Track Complete!&quot;;
                    feedbackBody.innerText = `Awesome work! You completed all ${this.quizQuestions.length} questions in ${this.categoryNames[this.currentTrack]}. Click &#x27;Exit Track&#x27; to choose your next challenge!`;
                    document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);
                }
            }

            closePracticeArena() {
                clearInterval(this.rushTimer);
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;tab-dashboard&#x27;).classList.remove(&#x27;hidden&#x27;);
                this.updateUI();
            }

            // Ultimate Study Hub
            selectUltimateTopic(topic) {
                this.selectedUltTopic = topic;
                this.examplesPage = 0;
                document.getElementById(&#x27;example-search-input&#x27;).value = &#x27;&#x27;;

                document.querySelectorAll(&#x27;.ult-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-300 hover:text-white&quot;;
                });
                const activeBtn = document.getElementById(`ult-tab-${topic}`);
                if (activeBtn) activeBtn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-300&quot;;

                document.getElementById(&#x27;jist-banner-title&#x27;).innerText = `${this.categoryNames[topic]}: Get the Jist Quiz`;
                document.getElementById(&#x27;examples-hub-title&#x27;).innerText = `250 Worked Examples: ${this.categoryNames[topic]}`;
                this.renderWorkedExamples();
            }

            changeExamplePage(delta) {
                const maxPages = Math.ceil(250 / this.examplesPerPage);
                this.examplesPage = Math.max(0, Math.min(maxPages - 1, this.examplesPage + delta));
                this.renderWorkedExamples(document.getElementById(&#x27;example-search-input&#x27;).value);
            }

            filterExamples() {
                this.examplesPage = 0;
                this.renderWorkedExamples(document.getElementById(&#x27;example-search-input&#x27;).value);
            }

            renderWorkedExamples(filter = &#x27;&#x27;) {
                const container = document.getElementById(&#x27;examples-list-container&#x27;);
                container.innerHTML = &#x27;&#x27;;

                let items = this.examplesData[this.selectedUltTopic] || [];
                if (filter.trim()) {
                    const q = filter.toLowerCase();
                    items = items.filter(x =&gt;
                        x.title.toLowerCase().includes(q) ||
                        x.passage.toLowerCase().includes(q) ||
                        x.analysis.toLowerCase().includes(q)
                    );
                }

                const start = this.examplesPage * this.examplesPerPage;
                const end = Math.min(items.length, start + this.examplesPerPage);
                document.getElementById(&#x27;examples-page-info&#x27;).innerText = items.length === 0
                    ? &#x27;No matching examples&#x27;
                    : `Showing ${start + 1}–${end} of ${items.length}`;

                items.slice(start, end).forEach(item =&gt; {
                    const div = document.createElement(&#x27;div&#x27;);
                    div.className = &quot;bg-slate-950/90 border border-slate-800 p-4 rounded-2xl space-y-2.5&quot;;
                    div.innerHTML = `
                        &lt;div class=&quot;flex items-center justify-between&quot;&gt;
                            &lt;span class=&quot;text-xs font-extrabold text-emerald-400 font-heading&quot;&gt;${item.title}&lt;/span&gt;
                            &lt;span class=&quot;text-[10px] bg-slate-900 border border-slate-700 text-cyan-300 px-2.5 py-0.5 rounded-full font-semibold&quot;&gt;${item.tag}&lt;/span&gt;
                        &lt;/div&gt;
                        &lt;p class=&quot;text-xs md:text-sm text-slate-200 leading-relaxed&quot;&gt;&quot;${item.passage}&quot;&lt;/p&gt;
                        &lt;details class=&quot;group&quot;&gt;
                            &lt;summary class=&quot;text-xs font-bold text-amber-400 cursor-pointer hover:text-amber-300 select-none&quot;&gt;
                                🔎 Reveal Step-by-Step Clue Breakdown
                            &lt;/summary&gt;
                            &lt;div class=&quot;mt-2 text-xs text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800 leading-relaxed&quot;&gt;
                                ${item.analysis}
                            &lt;/div&gt;
                        &lt;/details&gt;
                    `;
                    container.appendChild(div);
                });
            }

            startJistQuiz() {
                this.launchPractice(this.selectedUltTopic, 25);
            }

            // Flashcard Vault
            selectVaultCategory(cat) {
                this.selectedVaultTopic = cat;
                this.currentCardIdx = 0;
                this.isFlipped = false;

                document.querySelectorAll(&#x27;.vault-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-300&quot;;
                });
                const active = document.getElementById(`vault-tab-${cat}`);
                if (active) active.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-300&quot;;

                this.renderFlashcard();
            }

            getFilteredDeck() {
                const deck = this.flashcardsData[this.selectedVaultTopic] || [];
                if (!this.showOnlyReview) return deck;
                return deck.filter(c =&gt; !this.masteredCards[`${this.selectedVaultTopic}_${c.id}`]);
            }

            renderFlashcard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) {
                    document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `0 / 0`;
                    document.getElementById(&#x27;card-front&#x27;).innerText = `🎉 All 250 Cards Mastered!`;
                    document.getElementById(&#x27;card-back&#x27;).innerText = `Literacy Champion!`;
                    document.getElementById(&#x27;card-tip&#x27;).innerText = `Click &quot;Show All&quot; to review the full deck again.`;
                    document.getElementById(&#x27;flashcard-mastered-badge&#x27;).classList.add(&#x27;hidden&#x27;);
                    return;
                }

                if (this.currentCardIdx &gt;= deck.length) this.currentCardIdx = 0;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;
                const isMastered = !!this.masteredCards[cardKey];

                document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `${this.currentCardIdx + 1} / ${deck.length}`;
                document.getElementById(&#x27;card-front&#x27;).innerText = card.front;
                document.getElementById(&#x27;card-back&#x27;).innerText = card.back;
                document.getElementById(&#x27;card-tip&#x27;).innerText = card.tip;

                const badge = document.getElementById(&#x27;flashcard-mastered-badge&#x27;);
                if (isMastered) badge.classList.remove(&#x27;hidden&#x27;);
                else badge.classList.add(&#x27;hidden&#x27;);

                document.getElementById(&#x27;btn-toggle-mastery&#x27;).innerText = isMastered ? &quot;Unmark Mastered&quot; : &quot;Mark Mastered&quot;;

                const idx = parseInt(num, 10) - 1;
                if (!isNaN(idx) &amp;&amp; idx &gt;= 0 &amp;&amp; idx &lt; deck.length) {
                    this.currentCardIdx = idx;
                    this.renderFlashcard();
                }
            }

            toggleMastery() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;

                if (this.masteredCards[cardKey]) {
                    delete this.masteredCards[cardKey];
                } else {
                    this.masteredCards[cardKey] = true;
                }
                this.saveData();
                this.renderFlashcard();
            }

            toggleFilterMastered() {
                this.showOnlyReview = !this.showOnlyReview;
                this.currentCardIdx = 0;
                const btn = document.getElementById(&#x27;btn-filter-mastered&#x27;);

            }

                flipper.style.transform = this.isFlipped ? &#x27;rotateY(180deg)&#x27; : &#x27;rotateY(0deg)&#x27;;
            }

            nextCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx + 1) % deck.length;
                this.renderFlashcard();
            }

            prevCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx - 1 + deck.length) % deck.length;
                this.renderFlashcard();
            }

            randomCard() {
                const deck = this.getFilteredDeck();
                if (deck.length &lt;= 1) return;
                this.currentCardIdx = Math.floor(Math.random() * deck.length);
                this.renderFlashcard();
            }

            seededRand(seed) {
                let x = Math.sin(seed * 9999.91) * 10000;
                return x - Math.floor(x);
            }

            shuffleWithSeed(arr, seed) {
                let copy = [...arr];
                for (let i = copy.length - 1; i &gt; 0; i--) {
                    const j = Math.floor(this.seededRand(seed + i) * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }
