    &lt;!-- App Engine Logic --&gt;
    &lt;script&gt;
        class MathStudyHallExtreme {
            constructor() {
                this.activeTab = &#x27;dashboard&#x27;;
                this.categories = [&#x27;addition&#x27;, &#x27;subtraction&#x27;, &#x27;multiplication&#x27;, &#x27;division&#x27;, &#x27;squareroots&#x27;, &#x27;exponents&#x27;, &#x27;pemdas&#x27;, &#x27;advanced&#x27;];
                
                // Active Quiz State
                this.currentTrack = null;
                this.currentQIndex = 0;
                this.quizQuestions = [];
                this.userScore = 0;
                this.isRushMode = false;
                this.rushTimer = null;
                this.timeLeft = 15;

                // Ultimate Hub State
                this.selectedUltTopic = &#x27;multiplication&#x27;;
                this.examplesData = {};

                // Vault Flashcard State
                this.selectedVaultTopic = &#x27;squareroots&#x27;;
                this.flashcardsData = {};
                this.masteredCards = {}; // Key: cat_idx
                this.showOnlyReview = false;
                this.currentCardIdx = 0;
                this.isFlipped = false;

                // User Local Progress
                this.progress = {};
                this.globalStars = 0;
                this.globalStreak = 0;

                this.initData();
                this.generateQuestions();
                this.generateWorkedExamples();
                this.init250FlashcardsData();
                
                this.updateUI();
                this.selectUltimateTopic(&#x27;multiplication&#x27;);
                this.selectVaultCategory(&#x27;squareroots&#x27;);
            }

            // LocalStorage Handling
            initData() {
                const saved = localStorage.getItem(&#x27;math_hall_extreme_prep_v1&#x27;);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        this.progress = parsed.progress || {};
                        this.globalStars = parsed.globalStars || 0;
                        this.globalStreak = parsed.globalStreak || 0;
                        this.masteredCards = parsed.masteredCards || {};
                    } catch(e) { this.progress = {}; this.masteredCards = {}; }
                }
                this.categories.forEach(c =&gt; {
                    if (!this.progress[c]) {
                        this.progress[c] = { completed: 0, highStreak: 0 };
                    }
                });
            }

            saveData() {
                localStorage.setItem(&#x27;math_hall_extreme_prep_v1&#x27;, JSON.stringify({
                    progress: this.progress,
                    globalStars: this.globalStars,
                    globalStreak: this.globalStreak,
                    masteredCards: this.masteredCards
                }));
                this.updateUI();
            }

            resetData() {
                if (confirm(&#x27;Are you sure you want to reset all progress, stars, and mastered cards?&#x27;)) {
                    localStorage.removeItem(&#x27;math_hall_extreme_prep_v1&#x27;);
                    this.progress = {};
                    this.globalStars = 0;
                    this.globalStreak = 0;
                    this.masteredCards = {};
                    this.initData();
                    this.updateUI();
                    this.renderFlashcard();
                }
            }

            // Helper random generator
            rnd(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // Generates 250 Questions per category (2,000 Total Questions)
            generateQuestions() {
                this.allQuestions = {};
                this.categories.forEach(cat =&gt; {
                    let questions = [];
                    for (let i = 1; i &lt;= 250; i++) {
                        let q = { prompt: &#x27;&#x27;, math: &#x27;&#x27;, ans: 0, isRemainder: false, quotient: 0, remainder: 0, explanation: &#x27;&#x27; };
                        
                        if (cat === &#x27;addition&#x27;) {
                            let a = this.rnd(1000, 99999);
                            let b = this.rnd(1000, 99999);
                            q.prompt = &quot;Solve the addition problem by adding column by column from right to left.&quot;;
                            q.math = `${a.toLocaleString()} + ${b.toLocaleString()} = ?`;
                            q.ans = a + b;
                            q.explanation = `${a.toLocaleString()} + ${b.toLocaleString()} = ${(a + b).toLocaleString()}. Start from ones place and carry over values over 9.`;
                        } else if (cat === &#x27;subtraction&#x27;) {
                            let a = this.rnd(10000, 99999);
                            let b = this.rnd(1000, a - 100);
                            q.prompt = &quot;Solve the multi-digit subtraction problem. Regroup when needed.&quot;;
                            q.math = `${a.toLocaleString()} − ${b.toLocaleString()} = ?`;
                            q.ans = a - b;
                            q.explanation = `${a.toLocaleString()} − ${b.toLocaleString()} = ${(a - b).toLocaleString()}.`;
                        } else if (cat === &#x27;multiplication&#x27;) {
                            let a = this.rnd(12, 99);
                            let b = this.rnd(12, 99);
                            q.prompt = &quot;Multiply the two numbers using standard algorithm or area model.&quot;;
                            q.math = `${a} × ${b} = ?`;
                            q.ans = a * b;
                            q.explanation = `${a} × ${b} = ${a * b}. Break into (${Math.floor(a/10)*10} + ${a%10}) × ${b} to check easily!`;
                        } else if (cat === &#x27;division&#x27;) {
                            let div = this.rnd(3, 9);
                            let quo = this.rnd(12, 99);
                            let rem = (i % 3 === 0) ? this.rnd(1, div - 1) : 0;
                            let dividend = div * quo + rem;
                            if (rem &gt; 0) {
                                q.isRemainder = true;
                                q.quotient = quo;
                                q.remainder = rem;
                                q.prompt = &quot;Solve the division problem. Enter both Quotient (Q) and Remainder (R).&quot;;
                                q.math = `${dividend} ÷ ${div} = ?`;
                                q.explanation = `${dividend} ÷ ${div} = Quotient ${quo} with Remainder ${rem} because (${div} × ${quo}) + ${rem} = ${dividend}.`;
                            } else {
                                q.prompt = &quot;Solve the exact division problem.&quot;;
                                q.math = `${dividend} ÷ ${div} = ?`;
                                q.ans = quo;
                                q.explanation = `${dividend} ÷ ${div} = ${quo}.`;
                            }
                        } else if (cat === &#x27;squareroots&#x27;) {
                            let root = (i % 20) + 1;
                            let sq = root * root;
                            q.prompt = &quot;Find the square root of the perfect square.&quot;;
                            q.math = `√${sq} = ?`;
                            q.ans = root;
                            q.explanation = `√${sq} = ${root} because ${root} × ${root} = ${sq}.`;
                        } else if (cat === &#x27;exponents&#x27;) {
                            if (i % 2 === 0) {
                                let p = (i % 5) + 1;
                                q.prompt = &quot;Evaluate the power of 10.&quot;;
                                q.math = `10^${p} = ?`;
                                q.ans = Math.pow(10, p);
                                q.explanation = `10^${p} equals 1 followed by ${p} zeros = ${Math.pow(10, p).toLocaleString()}.`;
                            } else {
                                let base = this.rnd(2, 5);
                                let exp = this.rnd(2, 4);
                                q.prompt = &quot;Evaluate the exponential expression.&quot;;
                                q.math = `${base}^${exp} = ?`;
                                q.ans = Math.pow(base, exp);
                                q.explanation = `${base}^${exp} = ${Array(exp).fill(base).join(&#x27; × &#x27;)} = ${Math.pow(base, exp)}.`;
                            }
                        } else if (cat === &#x27;pemdas&#x27;) {
                            let a = this.rnd(2, 10);
                            let b = this.rnd(2, 8);
                            let c = this.rnd(2, 6);
                            q.prompt = &quot;Solve following Order of Operations (PEMDAS: Parentheses first).&quot;;
                            q.math = `(${a} + ${b}) × ${c} = ?`;
                            q.ans = (a + b) * c;
                            q.explanation = `First evaluate parentheses: (${a} + ${b}) = ${a + b}. Then multiply: ${a + b} × ${c} = ${(a + b) * c}.`;
                        } else if (cat === &#x27;advanced&#x27;) {
                            let side = (i % 25) + 2;
                            q.prompt = &quot;Find the area of a square with given side length.&quot;;
                            q.math = `Side = ${side} units. Area = ?`;
                            q.ans = side * side;
                            q.explanation = `Area of a square = side × side = ${side} × ${side} = ${side * side} square units.`;
                        }
                        questions.push(q);
                    }
                    this.allQuestions[cat] = questions;
                });
            }

            // Generates 250 Worked Examples per topic
            generateWorkedExamples() {
                this.examplesData = {};
                this.categories.forEach(cat =&gt; {
                    let list = [];
                    for (let i = 1; i &lt;= 250; i++) {
                        let ex = { title: &#x27;&#x27;, problem: &#x27;&#x27;, solution: &#x27;&#x27;, keyTip: &#x27;&#x27; };
                        if (cat === &#x27;addition&#x27;) {
                            let a = i * 125 + 340;
                            let b = i * 85 + 190;
                            ex.title = `Example #${i}: Multi-Digit Addition`;
                            ex.problem = `Find the sum of ${a.toLocaleString()} and ${b.toLocaleString()}.`;
                            ex.solution = `${a.toLocaleString()} + ${b.toLocaleString()} = ${(a + b).toLocaleString()}. Line up digits in ones, tens, hundreds place.`;
                            ex.keyTip = &quot;Column Align&quot;;
                        } else if (cat === &#x27;subtraction&#x27;) {
                            let a = i * 200 + 1000;
                            let b = i * 75 + 250;
                            ex.title = `Example #${i}: Regrouping Subtraction`;
                            ex.problem = `Subtract ${b.toLocaleString()} from ${a.toLocaleString()}.`;
                            ex.solution = `${a.toLocaleString()} − ${b.toLocaleString()} = ${(a - b).toLocaleString()}.`;
                            ex.keyTip = &quot;Borrowing&quot;;
                        } else if (cat === &#x27;multiplication&#x27;) {
                            let a = (i % 30) + 11;
                            let b = (i % 15) + 12;
                            ex.title = `Example #${i}: Partial Products`;
                            ex.problem = `Calculate ${a} × ${b}.`;
                            ex.solution = `${a} × ${b} = ${a * b}. Break down into tens and ones for quick mental calculation.`;
                            ex.keyTip = &quot;Area Model&quot;;
                        } else if (cat === &#x27;division&#x27;) {
                            let div = (i % 7) + 3;
                            let quo = (i % 40) + 10;
                            ex.title = `Example #${i}: Division Model`;
                            ex.problem = `Divide ${div * quo} by ${div}.`;
                            ex.solution = `${div * quo} ÷ ${div} = ${quo}. Check: ${div} × ${quo} = ${div * quo}.`;
                            ex.keyTip = &quot;Inverse Mult&quot;;
                        } else if (cat === &#x27;squareroots&#x27;) {
                            let root = (i % 20) + 1;
                            ex.title = `Example #${i}: Perfect Square`;
                            ex.problem = `What is the value of √${root * root}?`;
                            ex.solution = `√${root * root} = ${root} because ${root} × ${root} = ${root * root}.`;
                            ex.keyTip = &quot;Square Roots&quot;;
                        } else if (cat === &#x27;exponents&#x27;) {
                            let pow = (i % 5) + 1;
                            ex.title = `Example #${i}: Power of 10`;
                            ex.problem = `Simplify 10^${pow}.`;
                            ex.solution = `10^${pow} = ${Math.pow(10, pow).toLocaleString()} (1 followed by ${pow} zeros).`;
                            ex.keyTip = &quot;Base 10&quot;;
                        } else if (cat === &#x27;pemdas&#x27;) {
                            let a = (i % 10) + 2;
                            let b = (i % 5) + 1;
                            ex.title = `Example #${i}: Order of Operations`;
                            ex.problem = `Evaluate (${a} + 5) × ${b}.`;
                            ex.solution = `Step 1: (${a} + 5) = ${a + 5}. Step 2: ${a + 5} × ${b} = ${(a + 5) * b}.`;
                            ex.keyTip = &quot;PEMDAS&quot;;
                        } else if (cat === &#x27;advanced&#x27;) {
                            let w = (i % 15) + 2;
                            let h = (i % 10) + 3;
                            ex.title = `Example #${i}: Perimeter Calculation`;
                            ex.problem = `Find the perimeter of a rectangle with length ${w} and width ${h}.`;
                            ex.solution = `Perimeter = 2 × (${w} + ${h}) = 2 × ${w + h} = ${2 * (w + h)} units.`;
                            ex.keyTip = &quot;Perimeter&quot;;
                        }
                        list.push(ex);
                    }
                    this.examplesData[cat] = list;
                });
            }

            // Generates 250 flashcards for ALL 8 topics (2,000 Flashcards Total)
            init250FlashcardsData() {
                this.flashcardsData = {};
                
                this.categories.forEach(cat =&gt; {
                    let deck = [];
                    for (let i = 1; i &lt;= 250; i++) {
                        let card = { id: i, front: &#x27;&#x27;, back: &#x27;&#x27;, tip: &#x27;&#x27; };

                        if (cat === &#x27;addition&#x27;) {
                            let a = this.rnd(120, 999);
                            let b = this.rnd(85, 950);
                            card.front = `${a.toLocaleString()} + ${b.toLocaleString()} = ?`;
                            card.back = `${(a + b).toLocaleString()}`;
                            card.tip = `Addition Rule: Align columns right-to-left. Regroup when sum is ≥ 10.`;
                        } else if (cat === &#x27;subtraction&#x27;) {
                            let a = this.rnd(500, 9999);
                            let b = this.rnd(100, a - 50);
                            card.front = `${a.toLocaleString()} − ${b.toLocaleString()} = ?`;
                            card.back = `${(a - b).toLocaleString()}`;
                            card.tip = `Subtraction Rule: Regroup/borrow from the next column to the left if top digit &lt; bottom digit.`;
                        } else if (cat === &#x27;multiplication&#x27;) {
                            let a = (i % 12) + 1;
                            let b = this.rnd(2, 12);
                            if (i % 2 === 0) {
                                a = this.rnd(15, 99);
                                b = this.rnd(11, 25);
                            }
                            card.front = `${a} × ${b} = ?`;
                            card.back = `${a * b}`;
                            card.tip = `Multiplication Rule: Use area model (Break into tens &amp; ones) or distributive property!`;
                        } else if (cat === &#x27;division&#x27;) {
                            let div = this.rnd(3, 12);
                            let quo = this.rnd(4, 50);
                            let rem = (i % 4 === 0) ? 0 : this.rnd(1, div - 1);
                            let dividend = div * quo + rem;
                            card.front = `${dividend} ÷ ${div} = ?`;
                            card.back = rem === 0 ? `Q = ${quo}` : `Q = ${quo}, R = ${rem}`;
                            card.tip = `Division Rule: Divide, Multiply, Subtract, Bring down (DMSB).`;
                        } else if (cat === &#x27;squareroots&#x27;) {
                            let root = (i % 20) + 1; // 1 to 20
                            let sq = root * root;
                            card.front = `√${sq} = ?`;
                            card.back = `${root}`;
                            card.tip = `${root} × ${root} = ${sq}. Square root undoes squaring a number!`;
                        } else if (cat === &#x27;exponents&#x27;) {
                            if (i % 2 === 0) {
                                let pow = (i % 6) + 1;
                                card.front = `10^${pow} = ?`;
                                card.back = `${Math.pow(10, pow).toLocaleString()}`;
                                card.tip = `10 to the power of ${pow} has a 1 followed by exactly ${pow} zeros!`;
                            } else {
                                let base = (i % 4) + 2;
                                let exp = (i % 3) + 2;
                                card.front = `${base}^${exp} = ?`;
                                card.back = `${Math.pow(base, exp)}`;
                                card.tip = `${base}^${exp} means multiply ${base} by itself ${exp} times.`;
                            }
                        } else if (cat === &#x27;pemdas&#x27;) {
                            let a = (i % 8) + 2;
                            let b = (i % 5) + 2;
                            let c = (i % 4) + 1;
                            let ans = (a + b) * c;
                            card.front = `(${a} + ${b}) × ${c} = ?`;
                            card.back = `${ans}`;
                            card.tip = `PEMDAS: Parentheses FIRST! ${a}+${b}=${a+b}, then multiply by ${c}.`;
                        } else if (cat === &#x27;advanced&#x27;) {
                            let num = (i % 10) + 1;
                            card.front = `Simplify or Equivalent: ${num}/5 = ?/20`;
                            card.back = `${num * 4}`;
                            card.tip = `Multiply both numerator and denominator by 4 to get equivalent fraction over 20.`;
                        }

                        deck.push(card);
                    }
                    this.flashcardsData[cat] = deck;
                });

                this.strategyCardsData = {
                    addition: [{ title: &#x27;💡 Column Regrouping&#x27;, body: &#x27;When adding numbers, start from the ones column. Carry any value over 9 to the tens column.&#x27; }],
                    subtraction: [{ title: &#x27;⚡ Borrowing Across Zeros&#x27;, body: &#x27;If you need to borrow from 0, go left until you find a non-zero digit, borrow 1, and change intervening zeros to 9s.&#x27; }],
                    multiplication: [{ title: &#x27;🧩 Area Model Shortcut&#x27;, body: &#x27;Break 24 × 15 into (20+4) × (10+5). Multiply the four sub-boxes and add the results!&#x27; }],
                    division: [{ title: &#x27;➗ Long Division Mnemonic&#x27;, body: &#x27;Does McDonald\&#x27;s Serve Cheeseburgers? Divide, Multiply, Subtract, Check, Bring Down!&#x27; }],
                    squareroots: [{ title: &#x27;💡 Visual Square Grid&#x27;, body: &#x27;A square root asks for the side length of a square. If area = 64, side = √64 = 8.&#x27; }],
                    exponents: [{ title: &#x27;🚀 Powers of 10 Rule&#x27;, body: &#x27;The exponent tells you the exact number of zeros after the 1. E.g., 10⁵ = 100,000.&#x27; }],
                    pemdas: [{ title: &#x27;📜 Order of Operations&#x27;, body: &#x27;P → E → MD (Left-to-Right) → AS (Left-to-Right). Parentheses always outrank everything!&#x27; }],
                    advanced: [{ title: &#x27;🧩 Equivalent Fractions&#x27;, body: &#x27;Multiply or divide top and bottom by the exact same non-zero number to preserve value.&#x27; }]
                };
            }

            // Tab Switching Navigation
            switchTab(tab) {
                this.activeTab = tab;
                document.querySelectorAll(&#x27;main &gt; section&#x27;).forEach(s =&gt; s.classList.add(&#x27;hidden&#x27;));
                document.getElementById(`tab-${tab}`).classList.remove(&#x27;hidden&#x27;);

                // Button styling
                [&#x27;dashboard&#x27;, &#x27;ultimate&#x27;, &#x27;vault&#x27;].forEach(t =&gt; {
                    const btn = document.getElementById(`nav-${t}-btn`);
                    if (t === tab) {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-md&quot;;
                    } else {
                        btn.className = &quot;px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-700/50&quot;;
                    }
                });

                if (tab === &#x27;dashboard&#x27;) {
                    document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.add(&#x27;hidden&#x27;);
                    document.getElementById(&#x27;tab-dashboard&#x27;).classList.remove(&#x27;hidden&#x27;);
                }
            }

            // Dashboard UI Updater
            updateUI() {
                let totalCompleted = 0;
                let totalPossible = this.categories.length * 250;

                this.categories.forEach(cat =&gt; {
                    let prog = this.progress[cat] || { completed: 0 };
                    totalCompleted += prog.completed;
                    let pct = Math.min(100, Math.round((prog.completed / 250) * 100));

                    let txt = document.getElementById(`prog-text-${cat}`);
                    let bar = document.getElementById(`prog-bar-${cat}`);
                    let pctTxt = document.getElementById(`prog-pct-${cat}`);

                    if (txt) txt.innerText = `${prog.completed} / 250`;
                    if (pctTxt) pctTxt.innerText = `${pct}%`;
                    if (bar) bar.style.width = `${pct}%`;
                });

                document.getElementById(&#x27;global-stars&#x27;).innerText = this.globalStars;
                document.getElementById(&#x27;global-streak&#x27;).innerText = this.globalStreak;

                let overallReadiness = Math.round((totalCompleted / totalPossible) * 100);
                document.getElementById(&#x27;readiness-score-display&#x27;).innerText = `${overallReadiness}%`;
            }

            // Launch Practice Track (250 questions)
            launchPractice(track) {
                this.currentTrack = track;
                this.currentQIndex = 0;
                this.userScore = 0;
                this.quizQuestions = this.allQuestions[track];

                document.getElementById(&#x27;tab-dashboard&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.remove(&#x27;hidden&#x27;);

                document.getElementById(&#x27;arena-track-title&#x27;).innerText = `${track.toUpperCase()} PREP TRACK`;
                this.loadArenaQuestion();
            }

            // Rush Mode Toggle
            toggleRushMode() {
                this.isRushMode = !this.isRushMode;
                const btn = document.getElementById(&#x27;toggle-rush-mode&#x27;);
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);

                if (this.isRushMode) {
                    btn.className = &quot;px-3 py-1 bg-rose-500 text-xs font-bold text-white border border-rose-400 rounded-xl shadow-md&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: ON&quot;;
                    timerDisp.classList.remove(&#x27;hidden&#x27;);
                    this.startRushTimer();
                } else {
                    btn.className = &quot;px-3 py-1 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                    btn.innerText = &quot;⏱️ Rush Mode: OFF&quot;;
                    timerDisp.classList.add(&#x27;hidden&#x27;);
                    clearInterval(this.rushTimer);
                }
            }

            startRushTimer() {
                clearInterval(this.rushTimer);
                this.timeLeft = 15;
                const timerDisp = document.getElementById(&#x27;rush-timer-display&#x27;);
                timerDisp.innerText = `${this.timeLeft}s`;

                this.rushTimer = setInterval(() =&gt; {
                    this.timeLeft--;
                    timerDisp.innerText = `${this.timeLeft}s`;
                    if (this.timeLeft &lt;= 0) {
                        clearInterval(this.rushTimer);
                        this.submitPracticeAnswer(true); // Forced timeout
                    }
                }, 1000);
            }

            loadArenaQuestion() {
                const q = this.quizQuestions[this.currentQIndex];
                document.getElementById(&#x27;arena-track-subtitle&#x27;).innerText = `Question ${this.currentQIndex + 1} of ${this.quizQuestions.length}`;
                document.getElementById(&#x27;arena-prompt&#x27;).innerText = q.prompt;
                document.getElementById(&#x27;arena-math-box&#x27;).innerText = q.math;

                // Reset inputs
                document.getElementById(&#x27;user-ans-input&#x27;).value = &#x27;&#x27;;
                document.getElementById(&#x27;user-quotient-input&#x27;).value = &#x27;&#x27;;
                document.getElementById(&#x27;user-remainder-input&#x27;).value = &#x27;&#x27;;

                document.getElementById(&#x27;arena-feedback-box&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-input-container&#x27;).classList.remove(&#x27;hidden&#x27;);

                if (q.isRemainder) {
                    document.getElementById(&#x27;input-mode-standard&#x27;).classList.add(&#x27;hidden&#x27;);
                    document.getElementById(&#x27;input-mode-remainder&#x27;).classList.remove(&#x27;hidden&#x27;);
                } else {
                    document.getElementById(&#x27;input-mode-standard&#x27;).classList.remove(&#x27;hidden&#x27;);
                    document.getElementById(&#x27;input-mode-remainder&#x27;).classList.add(&#x27;hidden&#x27;);
                }

                if (this.isRushMode) this.startRushTimer();
            }

            submitPracticeAnswer(isTimeout = false) {
                clearInterval(this.rushTimer);
                const q = this.quizQuestions[this.currentQIndex];
                let isCorrect = false;

                if (!isTimeout) {
                    if (q.isRemainder) {
                        let qVal = parseInt(document.getElementById(&#x27;user-quotient-input&#x27;).value) || 0;
                        let rVal = parseInt(document.getElementById(&#x27;user-remainder-input&#x27;).value) || 0;
                        isCorrect = (qVal === q.quotient &amp;&amp; rVal === q.remainder);
                    } else {
                        let userAns = parseInt(document.getElementById(&#x27;user-ans-input&#x27;).value.replace(/,/g, &#x27;&#x27;)) || 0;
                        isCorrect = (userAns === q.ans);
                    }
                }

                const feedbackBox = document.getElementById(&#x27;arena-feedback-box&#x27;);
                const feedbackTitle = document.getElementById(&#x27;arena-feedback-title&#x27;);
                const feedbackBody = document.getElementById(&#x27;arena-feedback-body&#x27;);

                feedbackBox.classList.remove(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-input-container&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;arena-next-container&#x27;).classList.remove(&#x27;hidden&#x27;);

                if (isCorrect) {
                    this.globalStars += 2;
                    this.globalStreak++;
                    this.progress[this.currentTrack].completed = Math.min(250, this.progress[this.currentTrack].completed + 1);

                    feedbackBox.className = &quot;p-4 rounded-2xl space-y-2 text-sm border bg-emerald-500/10 border-emerald-500/40 text-emerald-300&quot;;
                    feedbackTitle.innerText = &quot;🎉 Excellent! Correct Answer!&quot;;
                    feedbackBody.innerText = q.explanation;
                } else {
                    this.globalStreak = 0;
                    feedbackBox.className = &quot;p-4 rounded-2xl space-y-2 text-sm border bg-rose-500/10 border-rose-500/40 text-rose-300&quot;;
                    feedbackTitle.innerText = isTimeout ? &quot;⏰ Time Expired!&quot; : &quot;❌ Not Quite Right&quot;;
                    feedbackBody.innerText = `Step-by-Step Breakdown: ${q.explanation}`;
                }

                this.saveData();
            }

            nextPracticeQuestion() {
                if (this.currentQIndex &lt; this.quizQuestions.length - 1) {
                    this.currentQIndex++;
                    this.loadArenaQuestion();
                } else {
                    alert(`Track Complete! You earned stars and unlocked higher readiness!`);
                    this.closePracticeArena();
                }
            }

            closePracticeArena() {
                clearInterval(this.rushTimer);
                document.getElementById(&#x27;arena-quiz-screen&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;tab-dashboard&#x27;).classList.remove(&#x27;hidden&#x27;);
                this.updateUI();
            }

            // Ultimate Hub Topic Selector
            selectUltimateTopic(topic) {
                this.selectedUltTopic = topic;
                document.querySelectorAll(&#x27;.ult-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 hover:text-white&quot;;
                });
                const activeBtn = document.getElementById(`ult-tab-${topic}`);
                if (activeBtn) activeBtn.className = &quot;ult-tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-cyan-500 bg-cyan-500/20 text-cyan-300&quot;;

                document.getElementById(&#x27;jist-banner-title&#x27;).innerText = `${topic.toUpperCase()}: Get the Jist Quiz`;
                document.getElementById(&#x27;examples-hub-title&#x27;).innerText = `250 Step-by-Step ${topic.toUpperCase()} Worked Examples`;
                
                this.renderWorkedExamples();
            }

            renderWorkedExamples(filter = &#x27;&#x27;) {
                const container = document.getElementById(&#x27;examples-list-container&#x27;);
                container.innerHTML = &#x27;&#x27;;

                let items = this.examplesData[this.selectedUltTopic] || [];
                if (filter) {
                    items = items.filter(x =&gt; x.problem.toLowerCase().includes(filter.toLowerCase()) || x.solution.toLowerCase().includes(filter.toLowerCase()));
                }

                items.slice(0, 50).forEach(item =&gt; { // Render top 50 matches for high performance
                    let div = document.createElement(&#x27;div&#x27;);
                    div.className = &quot;bg-slate-900/90 border border-slate-800 p-4 rounded-xl space-y-2&quot;;
                    div.innerHTML = `
                        &lt;div class=&quot;flex items-center justify-between&quot;&gt;
                            &lt;span class=&quot;text-xs font-bold text-cyan-400 font-heading&quot;&gt;${item.title}&lt;/span&gt;
                            &lt;span class=&quot;text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-mono&quot;&gt;${item.keyTip}&lt;/span&gt;
                        &lt;/div&gt;
                        &lt;p class=&quot;text-sm font-bold text-white&quot;&gt;${item.problem}&lt;/p&gt;
                        &lt;div class=&quot;text-xs text-slate-300 bg-slate-950/80 p-2.5 rounded-lg border border-slate-800/80 font-mono leading-relaxed&quot;&gt;
                            💡 ${item.solution}
                        &lt;/div&gt;
                    `;
                    container.appendChild(div);
                });
            }

            filterExamples() {
                const val = document.getElementById(&#x27;example-search-input&#x27;).value;
                this.renderWorkedExamples(val);
            }

            startJistQuiz() {
                this.launchPractice(this.selectedUltTopic);
            }

            // Strategy Vault Category Switcher
            selectVaultCategory(cat) {
                this.selectedVaultTopic = cat;
                this.currentCardIdx = 0;
                this.isFlipped = false;

                document.querySelectorAll(&#x27;.vault-tab-btn&#x27;).forEach(btn =&gt; {
                    btn.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300&quot;;
                });
                const active = document.getElementById(`vault-tab-${cat}`);
                if (active) active.className = &quot;vault-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500/20 text-amber-300&quot;;

                this.renderFlashcard();
                this.renderVaultStrategies();
            }

            getFilteredDeck() {
                const deck = this.flashcardsData[this.selectedVaultTopic] || [];
                if (!this.showOnlyReview) return deck;
                return deck.filter(c =&gt; !this.masteredCards[`${this.selectedVaultTopic}_${c.id}`]);
            }

            renderFlashcard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) {
                    document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `0 / 0`;
                    document.getElementById(&#x27;card-front&#x27;).innerText = `🎉 All Cards Mastered!`;
                    document.getElementById(&#x27;card-back&#x27;).innerText = `Great Job!`;
                    document.getElementById(&#x27;card-tip&#x27;).innerText = `Toggle &quot;Show All&quot; to review this deck again.`;
                    document.getElementById(&#x27;flashcard-mastered-badge&#x27;).classList.add(&#x27;hidden&#x27;);
                    return;
                }

                if (this.currentCardIdx &gt;= deck.length) this.currentCardIdx = 0;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;
                const isMastered = !!this.masteredCards[cardKey];

                document.getElementById(&#x27;flashcard-index-counter&#x27;).innerText = `${this.currentCardIdx + 1} / ${deck.length} (Deck: 250)`;
                document.getElementById(&#x27;card-front&#x27;).innerText = card.front;
                document.getElementById(&#x27;card-back&#x27;).innerText = card.back;
                document.getElementById(&#x27;card-tip&#x27;).innerText = card.tip;

                const badge = document.getElementById(&#x27;flashcard-mastered-badge&#x27;);
                if (isMastered) badge.classList.remove(&#x27;hidden&#x27;);
                else badge.classList.add(&#x27;hidden&#x27;);

                const btnMaster = document.getElementById(&#x27;btn-toggle-mastery&#x27;);
                btnMaster.innerText = isMastered ? &quot;Unmark Mastered&quot; : &quot;Mark Mastered&quot;;

                const flipper = document.getElementById(&#x27;flashcard-flipper&#x27;);
                flipper.style.transform = &#x27;rotateY(0deg)&#x27;;
                this.isFlipped = false;
            }

            toggleMastery() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                const card = deck[this.currentCardIdx];
                const cardKey = `${this.selectedVaultTopic}_${card.id}`;

                if (this.masteredCards[cardKey]) {
                    delete this.masteredCards[cardKey];
                } else {
                    this.masteredCards[cardKey] = true;
                }
                this.saveData();
                this.renderFlashcard();
            }

            toggleFilterMastered() {
                this.showOnlyReview = !this.showOnlyReview;
                this.currentCardIdx = 0;
                const btn = document.getElementById(&#x27;btn-filter-mastered&#x27;);
                btn.innerText = this.showOnlyReview ? &quot;Needs Review&quot; : &quot;Show All&quot;;
                btn.className = this.showOnlyReview 
                    ? &quot;px-3 py-2 bg-amber-500/20 text-xs font-bold text-amber-300 border border-amber-500/40 rounded-xl transition&quot; 
                    : &quot;px-3 py-2 bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700 rounded-xl hover:text-white transition&quot;;
                this.renderFlashcard();
            }

            flipCard() {
                const flipper = document.getElementById(&#x27;flashcard-flipper&#x27;);
                this.isFlipped = !this.isFlipped;
                flipper.style.transform = this.isFlipped ? &#x27;rotateY(180deg)&#x27; : &#x27;rotateY(0deg)&#x27;;
            }

            nextCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx + 1) % deck.length;
                this.renderFlashcard();
            }

            prevCard() {
                const deck = this.getFilteredDeck();
                if (deck.length === 0) return;
                this.currentCardIdx = (this.currentCardIdx - 1 + deck.length) % deck.length;
                this.renderFlashcard();
            }

            randomCard() {
                const deck = this.getFilteredDeck();
                if (deck.length &lt;= 1) return;
                this.currentCardIdx = Math.floor(Math.random() * deck.length);
                this.renderFlashcard();
            }

            renderVaultStrategies() {
                const container = document.getElementById(&#x27;vault-strategy-cards&#x27;);
                container.innerHTML = &#x27;&#x27;;
                const strategies = this.strategyCardsData[this.selectedVaultTopic] || [];

                strategies.forEach(s =&gt; {
                    let card = document.createElement(&#x27;div&#x27;);
                    card.className = &quot;glass-card rounded-2xl p-5 border border-slate-800 space-y-2&quot;;
                    card.innerHTML = `
                        &lt;h4 class=&quot;text-sm font-bold text-amber-400 font-heading&quot;&gt;${s.title}&lt;/h4&gt;
                        &lt;p class=&quot;text-xs text-slate-300 leading-relaxed&quot;&gt;${s.body}&lt;/p&gt;
                    `;
                    container.appendChild(card);
                });
            }
        }

        // Initialize application on window load
        let app;
        window.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
            app = new MathStudyHallExtreme();
            window.app = app; // Expose to global window so HTML inline onclick handlers access it cleanly
        });
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</div>
<script>
  function show(key) {
    document.querySelectorAll('.study-frame').forEach(f => f.classList.toggle('active', f.id === 'frame-' + key));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  }
</script>
